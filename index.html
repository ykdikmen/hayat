  {k:"vespa", l:"Vespa & iş", c:"#45bf9b", w:["vespa","vespaya","motor","motora","tamir","bakım","servis","kask","lastik","yedek parça"]},
  {k:"ev", l:"Kira & faturalar", c:"#9c8cf0", w:["kira","kiraya","fatura","faturası","elektrik","doğalgaz","internet","telefon faturası","aidat","bolletta"]},
  {k:"eglence", l:"Eğlence", c:"#ee6fa0", w:["sinema","maç","maça","konser","oyun","playstation","eğlence","parti"]},
  {k:"abonelik", l:"Abonelik", c:"#5cc3dd", w:["abonelik","netflix","spotify","icloud","claude","chatgpt","youtube","prime","dazn"]},
  {k:"giyim", l:"Giyim & bakım", c:"#cf8ae6", w:["giyim","kıyafet","ayakkabı","tişört","ceket","berber","berbere","kuaför","parfüm"]},
  {k:"saglik", l:"Sağlık & spor", c:"#6fd27e", w:["eczane","ilaç","doktor","doktora","dişçi","gym","spor salonu","protein","vitamin"]},
  {k:"diger", l:"Diğer", c:"#8c96a3", w:[]}
];
const KAT_GELIR = [
  {k:"tur", l:"Tur / hak ediş", c:"#45bf9b", w:["tur","turdan","hakediş","hak ediş","ortaklık","pay"]},
  {k:"bahsis", l:"Bahşiş", c:"#e3b341", w:["bahşiş","tip"]},
  {k:"maas", l:"Ödeme / transfer", c:"#5fa8f5", w:["maaş","ödeme","transfer","havale"]},
  {k:"diger_gelir", l:"Diğer gelir", c:"#8c96a3", w:[]}
];
const katBul = (k, tip) => (tip === "gelir" ? KAT_GELIR : KAT_GIDER).find(x => x.k === k) || (tip === "gelir" ? KAT_GELIR[3] : KAT_GIDER[11]);

/* standing requests the scheduled Claude tasks answer (see README in the Drive folder) */
const KANALLAR = [
  {kod:"posta", onek:"📬 POSTA", metin:"📬 POSTA ÖZETİ (uygulamanın otomatik isteği)"},
  {kod:"brifing-sabah", onek:"📣 BRİFİNG SABAH", metin:"📣 BRİFİNG SABAH (uygulamanın otomatik isteği)"},
  {kod:"brifing-ogle", onek:"📣 BRİFİNG ÖĞLE", metin:"📣 BRİFİNG ÖĞLE (uygulamanın otomatik isteği)"},
  {kod:"brifing-aksam", onek:"📣 BRİFİNG AKŞAM", metin:"📣 BRİFİNG AKŞAM (uygulamanın otomatik isteği)"}
];
/* kanalOf: posta | brifing (any slot) | null; kanalKod: the exact slot */
const kanalOf = g => { const m = String((g && g.metin) || ""); return m.startsWith("📬 POSTA") ? "posta" : m.startsWith("📣") ? "brifing" : null; };
const kanalKod = g => { const m = String((g && g.metin) || ""); for (const k of KANALLAR) if (m.startsWith(k.onek)) return k.kod; return kanalOf(g); };

/* ---------- date helpers (YYYY-MM-DD in Rome time) ---------- */
const fmtYMD = new Intl.DateTimeFormat("en-CA",{timeZone:TZ,year:"numeric",month:"2-digit",day:"2-digit"});
const fmtHM = new Intl.DateTimeFormat("en-GB",{timeZone:TZ,hour:"2-digit",minute:"2-digit",hour12:false});
const fmtParts = new Intl.DateTimeFormat("en-GB",{timeZone:TZ,year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hour12:false});
const todayStr = () => fmtYMD.format(new Date());
const nowHM = () => fmtHM.format(new Date()).replace(/^24/, "00");
const romeHour = () => Number(nowHM().slice(0,2));
const d2u = s => { const [y,m,d] = s.split("-").map(Number); return new Date(Date.UTC(y,m-1,d)); };
const u2d = dt => dt.toISOString().slice(0,10);
const addDays = (s,n) => { const d = d2u(s); d.setUTCDate(d.getUTCDate()+n); return u2d(d); };
const dow = s => d2u(s).getUTCDay();
const weekStart = s => addDays(s, -((dow(s)+6)%7));
const weekDays = s => { const st = weekStart(s); return [0,1,2,3,4,5,6].map(i => addDays(st,i)); };
const daysBetween = (a,b) => Math.round((d2u(b)-d2u(a))/864e5);
const fmtLong = s => { const d = d2u(s); return `${GUN[d.getUTCDay()]}, ${d.getUTCDate()} ${AY[d.getUTCMonth()]}`; };
const fmtShort = s => { const d = d2u(s); return `${d.getUTCDate()} ${AY_K[d.getUTCMonth()]}`; };
const relLabel = s => { const n = daysBetween(S.today, s); return n===0?"Bugün":n===1?"Yarın":n===-1?"Dün":(n>0?`${n} gün sonra`:`${-n} gün önce`); };
const monthDays = ym => { const [y,m] = ym.split("-").map(Number); const n = new Date(Date.UTC(y,m,0)).getUTCDate(); return Array.from({length:n},(_,i)=>`${ym}-${String(i+1).padStart(2,"0")}`); };
const addMonths = (ym,n) => { const [y,m] = ym.split("-").map(Number); const d = new Date(Date.UTC(y,m-1+n,1)); return d.toISOString().slice(0,7); };
const monthName = ym => { const [y,m] = ym.split("-").map(Number); return `${AY[m-1]} ${y}`; };
const hmMin = hm => { const m = String(hm || "").match(/^(\d{1,2}):(\d{2})/); return m ? (+m[1])*60 + (+m[2]) : null; };
/* Rome wall-clock time on a date -> epoch ms */
function romeMs(date, hm){
  const [y,m,d] = date.split("-").map(Number), mm = hmMin(hm) || 0;
  const guess = Date.UTC(y, m-1, d, Math.floor(mm/60), mm%60);
  const p = {}; fmtParts.formatToParts(new Date(guess)).forEach(x => { p[x.type] = x.value; });
  const asRome = Date.UTC(+p.year, +p.month-1, +p.day, (+p.hour)%24, +p.minute);
  return guess - (asRome - guess);
}
function agoText(ms){
  const s = Math.round((Date.now() - ms)/1000);
  if (s < 60) return "şimdi"; if (s < 3600) return Math.round(s/60) + " dk önce";
  if (s < 86400) return Math.round(s/3600) + " sa önce";
  const d = fmtYMD.format(new Date(ms)); return fmtShort(d);
}
function untilText(min){ if (min < 1) return "şimdi"; if (min < 60) return `${min} dk sonra`; const h = Math.floor(min/60), m = min%60; return m ? `${h} sa ${m} dk sonra` : `${h} sa sonra`; }

/* ---------- small utils ---------- */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Math.random().toString(36).slice(2,10);
const clone = o => JSON.parse(JSON.stringify(o));
const nf1 = new Intl.NumberFormat("tr-TR",{maximumFractionDigits:1});
const nf2 = new Intl.NumberFormat("tr-TR",{minimumFractionDigits:0,maximumFractionDigits:2});
const nfEur = new Intl.NumberFormat("tr-TR",{maximumFractionDigits:0});
const eur = v => "€" + nfEur.format(Math.round(v || 0));
const eur2 = v => "€" + nf2.format(Math.round((v || 0)*100)/100);
const pctTxt = p => p==null ? "—" : Math.round(p*100) + "%";
const trLow = s => String(s || "").toLocaleLowerCase("tr").trim();

/* ---------- state ---------- */
const S = {
  mode: "loading",           // loading | live | mock
  banner: null, bannerKind: null, note: null,
  days: {}, goals: {}, notes: {}, settings: null, gelen: [],
  today: todayStr(), sel: null, month: null, tab: "bugun",
  loaded: false, kimlik: null,
  tours: {cache: {}, status: "idle", err: null, key: ""},
  habitEdit: false, confirmDel: null,
  ui: {seg: {ilerleme: "hafta", claude: "bildirim"}, turAcik: false, briefAcik: false, paraTip: "gider", paraKat: "yemek", paraAy: null, toast: null},
  agent: {you:"", reply:"", error:null, undo:null, open:false, pending:false, gelenId:null}
};
S.sel = S.today; S.month = S.today.slice(0,7); S.ui.paraAy = S.month;
const habits = () => (S.settings && Array.isArray(S.settings.habits) && S.settings.habits.length) ? S.settings.habits : DEFAULT_HABITS;
const blankDay = date => ({date, plan:[], checks:{}, counts:{}, sleep:null, energy:null, mood:null, focus:null, health:[], wins:[], note:""});
const getDay = date => S.days[date] || blankDay(date);
const dayPct = d => { const p = (d && d.plan) || []; return p.length ? p.filter(x=>x.done).length/p.length : null; };
const ayar = () => Object.assign({butce: null, paket: 6.5, ad: ""}, LS.get(K_AYAR) || {}, (S.settings && S.settings.ayar) || {});
/* Claude'lu (varsayılan) ya da Claude'suz: Claude'suz modda kalıcı istekler açılmaz, Claude'a giden düğmeler gizlenir */
const claudeVar = () => ayar().claude !== false;

/* ---------- Google connection (his Apps Script) ---------- */
const LS = {
  get(k){ try { return JSON.parse(localStorage.getItem(k) || "null"); } catch (e) { return null; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k){ try { localStorage.removeItem(k); } catch (e) {} }
};
const K_OTURUM = "hayat.oturum", K_ONBELLEK = "hayat.onbellek", K_BEKLEYEN = "hayat.bekleyen", K_GELEN_KUYRUK = "hayat.gelenKuyruk";
const K_AYAR = "hayat.ayar", K_TEMA = "hayat.tema", K_GORULEN = "hayat.gorulen", K_UYGULANDI = "hayat.uygulandi", K_SONCEVAP = "hayat.sonCevap";
const IOS = /iPhone|iPad|iPod/.test(navigator.userAgent);
const STANDALONE = !!(window.navigator.standalone || (window.matchMedia && matchMedia("(display-mode: standalone)").matches));
let OTURUM = LS.get(K_OTURUM);
function linkCoz(text){
  let s = String(text || "");
  try { s = decodeURIComponent(s); } catch (e) {}
  const m = s.match(/https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec\?k=([A-Za-z0-9]{20,})/);
  return m ? {adres: m[0].split("?")[0], k: m[1]} : null;
}
async function api(op, body, sure){
  if (window.HAYAT_TEST_API) return window.HAYAT_TEST_API(op, body || {});
  if (!OTURUM) throw {kod: "oturum"};
  const ac = new AbortController(); const z = setTimeout(() => ac.abort(), (sure || 30) * 1000);
  try {
    const r = await fetch(OTURUM.adres, {method: "POST", headers: {"Content-Type": "text/plain;charset=utf-8"},
      body: JSON.stringify(Object.assign({k: OTURUM.k, op}, body || {})), redirect: "follow", credentials: "omit", signal: ac.signal});
    const t = await r.text(); let j;
    try { j = JSON.parse(t); } catch (e) { throw {kod: "cevap"}; }
    if (j.hata === "yetki") throw {kod: "yetki"};
    if (j.hata) throw {kod: "sunucu", mesaj: j.hata};
    return j;
  } catch (e) {
    if (e && e.kod) throw e;
    if (e && e.name === "AbortError") throw {kod: "zaman"};
    throw {kod: "ag"};
  } finally { clearTimeout(z); }
}
function hataMetni(e){
  switch (e && e.kod) {
    case "yetki": return "Giriş linki geçersiz. Sunucuda yeniAnahtar'ı çalıştırıp yeni linki yapıştır.";
    case "ag": return "İnternet yok ya da Google'a ulaşılamadı. Yazdıkların telefonda bekliyor, bağlanınca gönderilir.";
    case "zaman": return "Google geç cevap verdi; birazdan tekrar denenecek.";
    case "cevap": return "Sunucu beklenmedik cevap verdi. Apps Script dağıtımında “Erişimi olan: Herkes” seçili mi?";
    case "sunucu": return "Sunucu hatası: " + (e.mesaj || "bilinmiyor");
    default: return "Bağlantı sorunu.";
  }
}

/* writes wait on the phone until Google confirms them (they survive closing the app) */
let bekleyen = LS.get(K_BEKLEYEN) || {};
let flushTimer = null, flushing = false;
function queueSave(path, data, delay){
  bekleyen[path] = data; LS.set(K_BEKLEYEN, bekleyen);
  clearTimeout(flushTimer); flushTimer = setTimeout(flush, delay == null ? 700 : delay);
}
async function flush(){
  if (S.mode === "mock") { bekleyen = {}; LS.set(K_BEKLEYEN, bekleyen); return; }
  if (flushing || !OTURUM) return;
  const paths = Object.keys(bekleyen); if (!paths.length) return;
  flushing = true;
  const sent = {}; paths.forEach(p => { sent[p] = bekleyen[p]; });
  let ok = false;
  try {
    await api("kaydet", {belgeler: paths.map(p => ({yol: p, veri: sent[p]}))});
    ok = true;
    paths.forEach(p => { if (bekleyen[p] === sent[p]) delete bekleyen[p]; });
    LS.set(K_BEKLEYEN, bekleyen);
    if (S.bannerKind === "kayit") { S.banner = null; S.bannerKind = null; scheduleRender(); }
    cacheSave();
  } catch (e) {
    if (e.kod === "yetki") cikis(true);
    else { S.banner = hataMetni(e); S.bannerKind = "kayit"; scheduleRender(); clearTimeout(flushTimer); flushTimer = setTimeout(flush, 20000); }
  } finally {
    flushing = false;
    if (ok && Object.keys(bekleyen).length) { clearTimeout(flushTimer); flushTimer = setTimeout(flush, 700); }
  }
}
function saveDay(date, delay){
  const d = S.days[date]; if (!d) return;
  d.updatedAt = new Date().toISOString(); d.v = 2;
  queueSave("days/" + date, clone(d), delay);
}
function editDay(date, fn, delay){
  const d = S.days[date] ? S.days[date] : (S.days[date] = blankDay(date)), once = Number((d.counts || {}).sigara) || 0, onceSayac = Object.assign({}, d.counts);
  fn(d);
  if (typeof sigaraIz === "function") sigaraIz(date, d, once);
  if (typeof izYaz === "function") izYaz(date, d, onceSayac);
  saveDay(date, delay);
  if (typeof bildirimSenk === "function" && (date === S.today || date === addDays(S.today, 1))) bildirimSenk();
}
function saveGoal(id){ queueSave("goals/" + id, clone(S.goals[id]), 300); }
function delGoal(id){ delete S.goals[id]; queueSave("goals/" + id, null, 0); }
function saveNote(id){ queueSave("notes/" + id, clone(S.notes[id]), 300); }
function delNote(id){ delete S.notes[id]; queueSave("notes/" + id, null, 0); }
function saveSettings(){ queueSave("meta/settings", clone(S.settings), 300); }

/* loading */
let lastLoad = 0, loading = null;
function load(){
  if (!OTURUM || S.mode === "mock") return Promise.resolve(false);
  if (loading) return loading;
  loading = (async () => {
    try {
      const r = await api("yukle", {hafta: weekStart(S.sel)}, 45);
      applyServer(r); S.loaded = true; S.mode = "live"; lastLoad = Date.now();
      if (S.bannerKind === "yukle") { S.banner = null; S.bannerKind = null; }
      cacheSave();
      afterData(true);
      return true;
    } catch (e) {
      if (e.kod === "yetki") { cikis(true); return false; }
      S.banner = (S.loaded ? "Son durum alınamadı. " : "") + hataMetni(e); S.bannerKind = "yukle";
      return false;
    } finally {
      loading = null; scheduleRender(); flush(); gelenKuyrukGonder();
    }
  })();
  return loading;
}
function applyServer(r){
  S.days = Object.assign({}, r.days || {});
  S.goals = Object.assign({}, r.goals || {});
  S.notes = Object.assign({}, r.notes || {});
  S.settings = r.settings || null;
  for (const [p, v] of Object.entries(bekleyen)) {
    if (p === "meta/settings") { S.settings = v ? clone(v) : null; continue; }
    const [col, id] = p.split("/");
    const t = col === "days" ? S.days : col === "goals" ? S.goals : col === "notes" ? S.notes : null;
    if (!t) continue;
    if (v === null) delete t[id]; else t[id] = clone(v);
  }
  const sv = r.gelen || [], kuyruk = LS.get(K_GELEN_KUYRUK) || [];
  S.gelen = sv.concat(kuyruk.filter(q => !sv.some(g => g.id === q.id)));
  if (r.kimlik && typeof r.kimlik === "object") S.kimlik = r.kimlik;
  if (r.hafta && Array.isArray(r.turlar)) storeTours(r.hafta, r.turlar);
  else if (r.turHata) { S.tours.err = {kod: "takvim", mesaj: r.turHata}; S.tours.status = "error"; }
}
function cacheSave(){ LS.set(K_ONBELLEK, {days: S.days, goals: S.goals, notes: S.notes, settings: S.settings, gelen: S.gelen, tours: S.tours.cache, kimlik: S.kimlik, at: Date.now()}); }
function cacheLoad(){
  const c = LS.get(K_ONBELLEK); if (!c) return false;
  S.days = c.days || {}; S.goals = c.goals || {}; S.notes = c.notes || {}; S.settings = c.settings || null;
  S.gelen = c.gelen || []; S.tours.cache = c.tours || {}; S.kimlik = c.kimlik || null; S.loaded = true; S.mode = "live";
  return true;
}
/* everything that should happen whenever fresh data arrives */
/* "Her gün": routine items (settings.rutin) are put into today's and tomorrow's plan once, so they can be ticked and reminded */
const rutinler = () => (S.settings && Array.isArray(S.settings.rutin)) ? S.settings.rutin : [];
const planSira = (a, b) => (a.time || "99") < (b.time || "99") ? -1 : (a.time || "99") > (b.time || "99") ? 1 : 0;
function rutinUygula(){
  const r = rutinler(); if (!S.loaded || !r.length) return;
  for (const t of [S.today, addDays(S.today, 1)]) {
    const d0 = getDay(t), eklendi = d0.rutin || [], eksik = r.filter(x => !eklendi.includes(x.id));
    if (!eksik.length) continue;
    editDay(t, d => {
      const var_ = new Set((d.plan || []).map(p => trLow(p.title || "")));
      d.plan = (d.plan || []).concat(eksik.filter(x => !var_.has(trLow(x.baslik))).map(x => ({id: uid(), time: x.saat || "", title: x.baslik, done: false, rutin: x.id}))).sort(planSira);
      d.rutin = eklendi.concat(eksik.map(x => x.id)).slice(-40);
    });
  }
}
function afterData(fromServer){
  claudeUygula();
  rutinUygula();
  if (fromServer) { kanalBakim(); yeniCevaplar(); if (typeof sesHazirla === "function") setTimeout(sesHazirla, 1500); }
  hatirlatKur();
  if (typeof profilKontrol === "function") profilKontrol();
  if (fromServer && typeof gunlukBekleyenler === "function") { gunlukBekleyenler(); swOturumYaz(); bildirimSenk(); }
}

/* inbox: what you told Claude (queued on the phone until Google has it) */
let gelenBusy = false;
function gelenGonder(kayit){
  const kuyruk = LS.get(K_GELEN_KUYRUK) || []; kuyruk.push(kayit); LS.set(K_GELEN_KUYRUK, kuyruk);
  gelenKuyrukGonder();
}
async function gelenKuyrukGonder(){
  if (gelenBusy || S.mode === "mock" || !OTURUM) return;
  gelenBusy = true;
  try {
    let kuyruk = LS.get(K_GELEN_KUYRUK) || [];
    while (kuyruk.length) {
      const k = kuyruk[0];
      const r = await api("gelen", {kayit: {id: k.id, metin: k.metin, durum: k.durum, sonuc: k.sonuc}});
      if (r && typeof r.anlik === "string") { LS.set("hayat.anlik", r.anlik !== "kurulu değil"); if (/^hata/.test(r.anlik)) LS.set("hayat.anlikSon", r.anlik); }
      kuyruk = (LS.get(K_GELEN_KUYRUK) || []).filter(x => x.id !== k.id); LS.set(K_GELEN_KUYRUK, kuyruk);
      const g = S.gelen.find(x => x.id === k.id); if (g) g.gonderildi = true;
    }
  } catch (e) { setTimeout(gelenKuyrukGonder, 30000); }
  finally { gelenBusy = false; cacheSave(); scheduleRender(); }
}

/* standing requests: one open "posta" and one open "brifing" request at all times, answered by the scheduled tasks */
function kanalBakim(force){
  if (S.mode !== "live" || !OTURUM || !claudeVar() || !ayar().ad) return;   /* profil (ad + Claude seçimi) kaydedilmeden açılmaz */
  for (const k of KANALLAR) {
    if (force && force !== k.kod) continue;
    if (S.gelen.some(g => kanalKod(g) === k.kod && g.durum === "bekliyor")) continue;
    const son = LS.get("hayat.kanal." + k.kod) || 0;
    if (!force && Date.now() - son < 45*60e3) continue;
    LS.set("hayat.kanal." + k.kod, Date.now());
    const kayit = {id: "g" + uid(), metin: k.metin, durum: "bekliyor", sonuc: "", zaman: new Date().toISOString(), gonderildi: false};
    S.gelen.push(kayit); gelenGonder(kayit);
  }
}
const sonucTemiz = s => String(s || "").replace(/\[\[[a-zçğıöşü]+\s[\s\S]*?\]\]/gi, "").trim();
const gZaman = g => { const t = Date.parse(g.islenme || g.zaman || ""); return isNaN(t) ? 0 : t; };
/* newest answered briefing / digest; skips the "Yeni brifing yukarıda." placeholders a run gives extra requests */
const YER_TUTUCU = /^\s*Yeni (brifing|özet)[^\n]{0,40}yukarıda\.?\s*$/i;
function sonKanal(kod){ return S.gelen.filter(g => kanalOf(g) === kod && g.durum === "islendi" && g.sonuc && !YER_TUTUCU.test(sonucTemiz(g.sonuc))).sort((a,b) => gZaman(b) - gZaman(a)); }

/* Claude can ask the app to write things only the app stores (money, journal) with a [[uygula {...}]] block */
function claudeUygula(){
  const yapildi = new Set(LS.get(K_UYGULANDI) || []);
  let n = 0;
  for (const g of S.gelen) {
    if (g.durum !== "islendi" || !g.sonuc || yapildi.has(g.id)) continue;
    const m = String(g.sonuc).match(/\[\[uygula\s+([\s\S]*?)\]\]/);
    if (!m) continue;
    yapildi.add(g.id);
    let j; try { j = JSON.parse(m[1]); } catch (e) { continue; }
    (Array.isArray(j.ops) ? j.ops : []).forEach((o, i) => {
      if (o.op === "rutin") {   /* add or remove "every day" items */
        let r = rutinler().slice();
        [].concat(o.ekle || []).forEach(x => { const b = String((x && x.baslik) || "").trim().slice(0, 120); if (b && !r.some(y => trLow(y.baslik) === trLow(b))) { r.push({id: uid(), saat: /^\d{2}:\d{2}$/.test(x.saat || "") ? x.saat : "", baslik: b}); n++; } });
        [].concat(o.sil || []).forEach(t => { const k = trLow(String(t)); const once = r.length; r = r.filter(y => !trLow(y.baslik).includes(k)); if (r.length < once) n++; });
        S.settings = Object.assign({}, S.settings || {}, {habits: habits(), rutin: r}); saveSettings();
        return;
      }
      if (o.op === "koc") {   /* koçun bir alan için notu: o alanın sayfasında "Koçun diyor ki" kartında 7 gün görünür */
        const alan = String(o.alan || "").toLowerCase(), metin = String(o.metin || "").trim().slice(0, 400);
        if (!/^[a-z0-9_-]{1,24}$/.test(alan) || !metin) return;
        S.settings = Object.assign({}, S.settings || {}, {habits: habits(), koc: Object.assign({}, (S.settings || {}).koc, {[alan]: {metin, zaman: S.today}})}); saveSettings(); n++;
        return;
      }
      const tarih = /^\d{4}-\d{2}-\d{2}$/.test(o.tarih || "") ? o.tarih : S.today, key = g.id + "_" + i;
      const d = S.days[tarih] || blankDay(tarih);
      d.cu = d.cu || []; if (d.cu.includes(key)) return;
      if (o.op === "para") {
        const tip = o.tip === "gelir" ? "gelir" : "gider", tutar = Math.abs(Number(String(o.tutar).replace(",", "."))) || 0;
        if (!tutar) return;
        d.para = (d.para || []).concat([{id: "c" + key, tip, tutar, kat: katBul(o.kat, tip).k, not: String(o.not || "").slice(0, 80), saat: /^\d{2}:\d{2}$/.test(o.saat || "") ? o.saat : ""}]);
      } else if (o.op === "gunluk") {
        const metin = String(o.metin || "").slice(0, 600); if (!metin) return;
        d.gunluk = d.gunluk || {};
        if (["niyet","iyi","gelistir"].includes(o.alan)) d.gunluk[o.alan] = metin;
        else if (o.alan === "sukur") d.gunluk.sukur = (d.gunluk.sukur || []).filter(Boolean).concat([metin]).slice(-3);
        else d.note = (d.note ? d.note + "\n" : "") + metin;
      } else if (o.op === "plan" && Array.isArray(o.plan)) {
        /* replace the day's plan (Claude rearranged it); keep ticks and calendar marks of items that stay */
        const eski = d.plan || [], ayni = t => eski.find(x => trLow(x.title || "") === trLow(t));
        d.plan = o.plan.filter(x => x && (x.baslik || x.title)).slice(0, 20).map(x => {
          const title = String(x.baslik || x.title).slice(0, 120), time = /^\d{2}:\d{2}$/.test(x.saat || x.time || "") ? (x.saat || x.time) : "", e = ayni(title);
          return Object.assign({id: e ? e.id : uid(), time, title, done: e ? !!e.done : false}, e && e.takvim ? {takvim: true} : {});
        }).sort((a, b) => (a.time || "99") < (b.time || "99") ? -1 : 1);
      } else if (o.op === "uyku") {
        if (/^\d{2}:\d{2}$/.test(o.yatis || "") && /^\d{2}:\d{2}$/.test(o.kalkis || "")) { d.uykuSaat = {yatis: o.yatis, kalkis: o.kalkis}; d.sleep = uykuHesap(o.yatis, o.kalkis); }
      } else return;
      d.cu = d.cu.concat([key]).slice(-60);
      S.days[tarih] = d; saveDay(tarih); n++;
    });
  }
  LS.set(K_UYGULANDI, [...yapildi].slice(-400));
  if (n) toast(`Claude ${n} kaydı uygulamaya işledi.`);
}
/* new Claude answers since last time: toast + system notification when the app is in the background */
function yeniCevaplar(){
  const son = LS.get(K_SONCEVAP) || 0;
  const yeni = S.gelen.filter(g => g.durum === "islendi" && gZaman(g) > son).sort((a,b) => gZaman(a) - gZaman(b));

  if (document.visibilityState !== "visible") sistemBildirim(baslik, ilk.replace(/\*\*/g, "").slice(0, 140), "cevap-" + g.id, k === "posta" ? "#claude" : "#bugun");
}

/* ---------- tours (Tur Programı calendar, read by his Google script) ---------- */
function parseTour(ev){
  if (!ev || !ev.tarih || !ev.saat) return null;
  const sum = ev.baslik || "", desc = ev.aciklama || "";
  const cancelled = /^\s*(IPTAL|İPTAL|iptal)/.test(sum) || /\bCANCEL\b/.test(sum);
  const external = /^\s*(DIŞ|DİŞ|Dış|DIS)/.test(sum);
  let pax = 0; const mp = sum.match(/\((\d+)\)/) || desc.match(/Ki[sş]i:\s*(\d+)/i); if (mp) pax = +mp[1];
  let net = 0; const mn = desc.match(/Net:\s*EUR\s*([\d.,]+)/i); if (mn) net = parseFloat(mn[1].replace(/\./g,"").replace(",", ".")) || 0;
  const platform = /\bGYG\b/.test(sum) ? "GYG" : /\bVIA\b/.test(sum) ? "VIA" : "";
  const name = sum.replace(/^\s*(IPTAL|İPTAL)\s*-\s*/i,"").replace(/^\s*\d{1,2}:\d{2}(\?\s*\([^)]*\))?\s*/,"").replace(/\(\d+\)/,"").replace(/\b(GYG|VIA)\b/,"").replace(/\s+/g," ").trim();
  const guide = ((desc.match(/Guide:\s*([^\n]+)/) || [])[1] || "").trim();
  const closed = /Kapan[ıi][sş]:\s*yap[ıi]ld[ıi]/i.test(desc);
  return {date: ev.tarih, time: ev.saat, name, pax, net, platform, guide, closed, cancelled, external};
}
function storeTours(key, list){
  S.tours.cache[key] = {events: (list || []).map(parseTour).filter(Boolean), storedAt: Date.now()};
  if (key === S.tours.key) { S.tours.err = null; S.tours.status = "ok"; }
}
function toursFor(date){
  const c = S.tours.cache[weekStart(date)];
  return c ? toursFromEvents(c.events, date) : null;
}
function toursFromEvents(events, date){
  const all = events.filter(t => t.date === date).sort((a,b) => a.time < b.time ? -1 : a.time > b.time ? 1 : 0);
  const real = all.filter(t => !t.cancelled && !t.external);
  const nowMin = date === S.today ? hmMin(nowHM()) : (date < S.today ? 9999 : -1);
  return {list: real, count: real.length, pax: real.reduce((a,t)=>a+t.pax,0), net: real.reduce((a,t)=>a+t.net,0),
          closed: real.filter(t=>t.closed).length, external: all.filter(t=>t.external && !t.cancelled).length,
          cancelled: all.filter(t=>t.cancelled).length,
          rehbersiz: real.filter(t => !t.guide).length,
          acik: real.filter(t => !t.closed && (hmMin(t.time) ?? 0) + 90 <= nowMin).length,
          ilk: real.length ? real[0].time : null, son: real.length ? real[real.length-1].time : null};
}
async function watchTours(force, date){
  const key = weekStart(date || S.sel); if (!date) S.tours.key = key;
  if (S.mode === "mock" || !OTURUM) return;
  const c = S.tours.cache[key];
  if (c && !force && Date.now() - c.storedAt < 10*60e3) return;
  if (!date) { S.tours.status = c ? "ok" : "loading"; if (!c) scheduleRender(); }
  try { const r = await api("turlar", {hafta: key}); storeTours(key, r.turlar || []); }
  catch (e) { if (key === S.tours.key) { S.tours.err = e; S.tours.status = S.tours.cache[key] ? "ok" : "error"; } }
  cacheSave(); scheduleRender();
}
function tourErrorText(err){ return err && err.kod === "takvim" ? "Tur Programı takvimi okunamadı: " + (err.mesaj || "") : hataMetni(err); }
/* compress times: 09:00, 10:00 ×2, 13:00 */
function saatOzet(list){
  const m = []; list.forEach(t => { const l = m[m.length-1]; if (l && l.t === t.time) l.n++; else m.push({t: t.time, n: 1}); });
  return m.map(x => x.n > 1 ? `${x.t} ×${x.n}` : x.t).join(", ");
}

/* ---------- day-level computations ---------- */
function gunDolu(d){
  if (!d) return false;
  return (d.plan || []).some(x => x.done) || Object.values(d.checks || {}).some(Boolean) || Object.values(d.counts || {}).some(v => v > 0) ||
    d.sleep != null || d.mood != null || d.energy != null || (d.para || []).length > 0 || !!(d.note && d.note.trim()) || (d.wins || []).length > 0;
}
function seri(){
  let n = 0, day = S.today;
  if (!gunDolu(S.days[day])) day = addDays(day, -1);
  while (gunDolu(S.days[day]) && n < 400) { n++; day = addDays(day, -1); }
  return n;
}

}

    if (sp.length >= 2 && ns.length >= 2) out.push(`Spor yaptığın günlerde ruh halin ortalama <b>${nf1.format(avg(sp))}</b>, yapmadığın günlerde <b>${nf1.format(avg(ns))}</b>.`);
    const sl = withMood.filter(d => d.sleep != null);
    const iyi = sl.filter(d => d.sleep >= 7).map(d => d.energy ?? d.mood), kot = sl.filter(d => d.sleep < 7).map(d => d.energy ?? d.mood);
    if (iyi.length >= 2 && kot.length >= 2) out.push(`7 saat ve üstü uyuduğun günler enerjin <b>${nf1.format(avg(iyi))}</b>; daha az uyuduğun günler <b>${nf1.format(avg(kot))}</b>.`);
    const sg = withMood.filter(d => (d.counts || {}).sigara != null);
    if (sg.length >= 4) { const med = sg.map(d => d.counts.sigara).sort((a,b) => a-b)[Math.floor(sg.length/2)];
      const az = sg.filter(d => d.counts.sigara <= med).map(d => d.mood), cok = sg.filter(d => d.counts.sigara > med).map(d => d.mood);
      if (az.length >= 2 && cok.length >= 2) out.push(`Sigarayı ${med} ve altında tuttuğun günler ruh halin <b>${nf1.format(avg(az))}</b>, daha fazla içtiğin günler <b>${nf1.format(avg(cok))}</b>.`); }
    const pl = withMood.filter(d => (d.plan || []).length);
    const tam = pl.filter(d => dayPct(d) >= .8).map(d => d.mood), eks = pl.filter(d => dayPct(d) < .8).map(d => d.mood);
    if (tam.length >= 2 && eks.length >= 2) out.push(`Planının %80'ini bitirdiğin günler ruh halin <b>${nf1.format(avg(tam))}</b>, bitiremediğin günler <b>${nf1.format(avg(eks))}</b>.`);
  }
  if (out.length) return out.map(t => `<div class="insight">${I.trend}<span>${t}</span></div>`).join("");
  return `<p class="empty" style="margin-bottom:8px">${withMood.length} gün kayıt var. 5 günden sonra burada kendi kalıpların çıkmaya başlar. Bunun için en çok işe yarayanlar:</p>
    <div class="insight">${I.check}<span><b>Ruh hali, enerji, odak</b> (her akşam): her şeyin karşılaştırıldığı temel çizgi.</span></div>
    <div class="insight">${I.check}<span><b>Yatış ve kalkış saati</b>: uyku süresi ve düzeni, ertesi günün enerjisini en çok belirleyen şey.</span></div>
    <div class="insight">${I.check}<span><b>Sigara, kahve, alkol</b>: hangisinin uykuyu ve ruh halini bozduğunu gösterir.</span></div>
    <div class="insight">${I.check}<span><b>Spor ve hareket</b>: enerjiyle bağını birkaç haftada görürsün.</span></div>
    <div class="insight">${I.check}<span><b>Harcamalar</b>: ruh halinin düşük olduğu günler daha çok mu harcıyorsun?</span></div>
    <div class="insight">${I.check}<span><b>Bir cümle not</b>: rakamların neden öyle olduğunu üç ay sonra sadece bu hatırlatır.</span></div>`;
}

/* ---------- 2.6: canlılık (gösterge, sesler, efektler), son sigara sayacı, haftalık karne, ruh hali takvimi, sesli günlük, uygulamadan bildirim ---------- */
const AZ_HAREKET = () => !!(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches);
const seslerAcik = () => LS.get("hayat.sesler") !== false;

/* ---- sesler: dosya yok, telefonda üretilir ---- */
let AC = null;
function acx(){
  try {
    if (!AC) { const C = window.AudioContext || window.webkitAudioContext; if (!C) return null; AC = new C(); }
    if (AC.state === "suspended") AC.resume();
    return AC;
  } catch (e) { return null; }
}
function gurultu(c, sn){ const b = c.createBuffer(1, Math.ceil(c.sampleRate * sn), c.sampleRate), v = b.getChannelData(0); for (let i = 0; i < v.length; i++) v[i] = Math.random() * 2 - 1; return b; }
function efektSes(tur){
  if (!seslerAcik()) return;
  const c = acx(); if (!c) return;
  window.__efektSes = (window.__efektSes || []).concat(tur);
  const t = c.currentTime + .02, cik = c.createGain(); cik.gain.value = .55; cik.connect(c.destination);
  const zarf = (g, pts) => { g.gain.setValueAtTime(0, t); pts.forEach(([dt, v]) => g.gain.linearRampToValueAtTime(v, t + dt)); };
  if (tur === "vespa") {
    /* iki zamanlı motor: düşük rölanti, gaz, geri rölanti — ibreyle aynı sürede */
    const f = c.createBiquadFilter(); f.type = "lowpass"; f.Q.value = 6;
    const sek = c.createWaveShaper(), egri = new Float32Array(256); for (let i = 0; i < 256; i++) { const x = i / 128 - 1; egri[i] = Math.tanh(x * 3.2); } sek.curve = egri;
    const g = c.createGain(); zarf(g, [[.05, .42], [.55, .5], [1.2, .3], [1.5, 0]]);
    [["sawtooth", 1, .9], ["square", 2.01, .35]].forEach(([tip, kat, ses]) => {
      const o = c.createOscillator(), og = c.createGain(); o.type = tip; og.gain.value = ses;
      o.frequency.setValueAtTime(28 * kat, t); o.frequency.exponentialRampToValueAtTime(104 * kat, t + .52); o.frequency.exponentialRampToValueAtTime(32 * kat, t + 1.38);
      o.connect(og).connect(sek); o.start(t); o.stop(t + 1.55);
    });

    sek.connect(f).connect(g).connect(cik);
  } else if (tur === "puf") {
    const n = c.createBufferSource(); n.buffer = gurultu(c, .9);
    const f = c.createBiquadFilter(); f.type = "bandpass"; f.Q.value = .8; f.frequency.setValueAtTime(1600, t); f.frequency.exponentialRampToValueAtTime(500, t + .8);
    const g = c.createGain(); zarf(g, [[.09, .32], [.85, 0]]);
    n.connect(f).connect(g).connect(cik); n.start(t); n.stop(t + .9);
  } else if (tur === "damla") {
    [[0, 950, 320, .45], [.1, 1500, 700, .2]].forEach(([dt, a, b, v]) => {
      const o = c.createOscillator(), g = c.createGain(); o.type = "sine";
      o.frequency.setValueAtTime(a, t + dt); o.frequency.exponentialRampToValueAtTime(b, t + dt + .12);
      g.gain.setValueAtTime(0, t + dt); g.gain.linearRampToValueAtTime(v, t + dt + .01); g.gain.exponentialRampToValueAtTime(.001, t + dt + .2);
      o.connect(g).connect(cik); o.start(t + dt); o.stop(t + dt + .22);
    });
  } else if (tur === "sayfa") {   /* sayfa açılışı: kısa, alçak bir yükseliş */
    const o = c.createOscillator(), g = c.createGain(); o.type = "sine";
    o.frequency.setValueAtTime(420, t); o.frequency.exponentialRampToValueAtTime(760, t + .13);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.12, t + .02); g.gain.exponentialRampToValueAtTime(.001, t + .19);
    o.connect(g).connect(cik); o.start(t); o.stop(t + .2);
  } else if (tur === "ding" || tur === "kutlama") {
    const notalar = tur === "ding" ? [[0, 1318.5], [0, 1975.5]] : [[0, 1046.5], [.09, 1318.5], [.18, 1568], [.27, 2093]];
    notalar.forEach(([dt, fr]) => {
      const o = c.createOscillator(), g = c.createGain(); o.type = "sine"; o.frequency.value = fr;

    });
  } else {
    const o = c.createOscillator(), g = c.createGain(); o.type = "triangle"; o.frequency.value = tur === "eksi" ? 440 : 660;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.25, t + .005); g.gain.exponentialRampToValueAtTime(.001, t + .07);
    o.connect(g).connect(cik); o.start(t); o.stop(t + .08);
  }
}

function efekt(el, tur){

    fxParca("fx-duman", x - 15 + (Math.random() * 16 - 8), r.top - 4, {"--dx": (Math.random() * 64 - 32).toFixed(0) + "px", width: b, height: b, "animation-delay": i * 95 + "ms"}, 2300 + i * 95); }
  else if (tur === "damla") { fxParca("fx-damla", x - 7, r.top - 8, {}, 700); fxParca("fx-halka", x - 18, y - 18, {"animation-delay": "420ms"}, 1300); }

    for (let i = 0; i < n; i++) { const a = Math.random() * Math.PI * 2, h = (tur === "konfeti" ? 40 : 90) + Math.random() * 70;
      fxParca("fx-konfeti", x - 3, y - 4, {"--dx": (Math.cos(a) * h).toFixed(0) + "px", "--dy": (Math.sin(a) * h * .6 - 50).toFixed(0) + "px", "--r": (Math.random() * 720 - 360).toFixed(0) + "deg", background: renk[i % renk.length], "animation-delay": (Math.random() * 60).toFixed(0) + "ms"}, 1400); }
  }

  const a = g.querySelector(".gyay"); if (a) { a.style.strokeDasharray = `${Math.max(0, Math.min(1, x)).toFixed(4)} 1`; a.style.strokeOpacity = x > .005 ? 1 : 0; }

  const s = g.querySelector(".gsay"); if (s && g.dataset.bos !== "1") s.textContent = Math.round(Math.max(0, Math.min(1, x)) * 100);

/* Sigara sayısı arttıkça saatini de tutar (bugün için). editDay her değişiklikte çağırır. */
function sigaraIz(date, d, once){
  const sonra = Number((d.counts || {}).sigara) || 0;
  if (sonra === once || date !== S.today) return;
  let l = Array.isArray(d.sigaraSaat) ? d.sigaraSaat.slice() : [];
  if (sonra > once) { const s = nowHM(); for (let i = once; i < sonra; i++) l.push(s); }

}
function sigaraZamanlari(gun){

  for (let i = gun - 1; i >= 0; i--) { const x = addDays(S.today, -i), d = S.days[x]; for (const s of ((d && d.sigaraSaat) || [])) out.push(romeMs(x, s)); }

}
function sureYaz(ms){
  const dk = Math.max(0, Math.floor(ms / 60e3)), g = Math.floor(dk / 1440), sa = Math.floor(dk % 1440 / 60), d = dk % 60;

}
const SIGARA_ESIK = [[20, "Nabzın normale dönmeye başlar."], [480, "Kandaki karbonmonoksit yarıya iner, oksijen toparlanır."], [720, "Karbonmonoksit seviyesi normale yakın."],

/* ---- haftalık karne (İlerleme → Hafta) ---- */
function haftaOlc(days){
  const past = days.filter(x => x <= S.today), ds = past.map(getDay), hs = habits(), var_ = k => hs.some(x => x.key === k);
  const kayitli = ds.filter(d => (d.plan || []).length || Object.keys(d.counts || {}).length || Object.keys(d.checks || {}).length || d.mood != null || d.sleep != null).length;
  let dn = 0, tot = 0; ds.forEach(d => { const p = d.plan || []; tot += p.length; dn += p.filter(x => x.done).length; });
  const ort = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;
  const sig = ds.map(d => (d.counts || {}).sigara).filter(v => v != null), su = ds.map(d => (d.counts || {}).su).filter(v => v != null);
  return {gun: past.length, kayitli, plan: tot ? dn / tot : null, spor: var_("spor") ? ds.filter(d => (d.checks || {}).spor).length : null,
    sigara: var_("sigara") && sig.length ? sig.reduce((a, b) => a + b, 0) : null, sigaraOrt: sig.length ? ort(sig) : null, su: su.length ? ort(su) : null,
    uyku: ort(ds.map(d => d.sleep).filter(v => v != null)), ruh: ort(ds.map(d => d.mood).filter(v => v != null))};
}
const KARNE_NOT = [[.85, "Pekiyi"], [.7, "İyi"], [.55, "Orta"], [.4, "Geçer"], [0, "Zayıf"]];

  const c = (x) => Math.max(0, Math.min(1, x));

    return [(f > 0 ? "▲ " : "▼ ") + (bicim === "%" ? Math.round(Math.abs(f) * 100) + " puan" : nf1.format(Math.abs(f))), iyi]; };
  if (bu.plan != null) satir.push(["Plan", Math.round(bu.plan * 100) + "%", c(bu.plan), ...fark(bu.plan, once.plan, false, "%")]);
  if (bu.spor != null) satir.push(["Spor", bu.spor + " gün", c(bu.spor / 3), ...fark(bu.spor, once.spor)]);
  if (bu.sigara != null) satir.push(["Sigara", `${bu.sigara} (ort ${nf1.format(bu.sigaraOrt)}/gün)`, once.sigaraOrt ? c(1.2 - bu.sigaraOrt / Math.max(once.sigaraOrt, .5)) : c(1 - bu.sigaraOrt / 15), ...fark(bu.sigaraOrt, once.sigaraOrt, true)]);

    <div class="rows">${satir.map(([a, v, p, f, iyi]) => `<div class="row karne-satir"><span>${esc(a)}</span><span class="karne-p" aria-hidden="true"><i style="width:${Math.round(p * 100)}%"></i></span><b>${esc(v)}${f ? ` <small class="${iyi == null ? "muted" : iyi ? "iyi" : "kotu"}">${esc(f)}${iyi == null ? "" : iyi ? " iyi" : " kötü"}</small>` : ""}</b></div>`).join("")}</div></section>`;

/* ---- arka plan: günün tarihinden tohumlanan üç yumuşak ışık, yavaşça süzülür (her gün başka bir düzen) ---- */

const trSayi = (v, ond) => new Intl.NumberFormat("tr-TR", {minimumFractionDigits: ond, maximumFractionDigits: ond}).format(v);
function sayilariSay(kok){
  const els = [...kok.querySelectorAll(".num, .stat b, .big-num")].filter(el => !el.closest("svg") && !el.id && el.children.length === 0).slice(0, 14);
  els.forEach(el => {

    if (!m) return;
    const ond = (m[2].split(",")[1] || "").length, hedef = Number(m[2].replace(/\./g, "").replace(",", "."));
    if (!isFinite(hedef) || hedef === 0) return;
    const bas = performance.now(), sure = 650 + Math.min(450, hedef > 99 ? 300 : 0);
    const adim = now => { const p = Math.min(1, (now - bas) / sure), e = 1 - Math.pow(1 - p, 3); if (!el.isConnected) return; el.textContent = m[1] + trSayi(hedef * e, ond) + m[3]; if (p < 1) requestAnimationFrame(adim); else el.textContent = t; };

/* ---------- instant parser for simple Turkish logs; anything else goes to Claude ---------- */
const SAYI = {"bir":1,"iki":2,"üç":3,"uç":3,"dört":4,"beş":5,"altı":6,"yedi":7,"sekiz":8,"dokuz":9,"on":10,"yarım":0.5};

const PARA_PARA = /(€|\beuro?\b|\beur\b|\bavro\b|\bharcadım\b|\bharcama\b|\bödedim\b|\bverdim\b|\bkazandım\b|\bbahşiş\b|\bmaaş\b|\bgelir\b|\bgider\b)/;

function paraOku(p){

  for (const k of list) if (k.w.some(w => new RegExp("(^|\\s)" + escRe(w) + "(\\s|$|[.,!])").test(p))) { kat = k.k; break; }

  let not = p.replace(m[0], " ").replace(/^\+/, "").replace(/(€|\beuro?\b|\beur\b|\bavro\b|\bharcadım\b|\bharcama\b|\bödedim\b|\bverdim\b|\bkazandım\b|\bgelir\b|\bgider\b|\baldım\b|\bpara\b|\biçin\b)/g, " ").replace(/\s+/g, " ").trim();
  if (not) not = not.charAt(0).toLocaleUpperCase("tr") + not.slice(1);

}
function localParse(text){
  const t = trLow(text).replace(/[!]+/g, " ").replace(/\s+/g, " ").trim().replace(/\.$/, "");
  if (!t) return null;

    if ((m = p.match(re("(?:" + NUMRE + "\\s*(?:kez|kere|defa)\\s*)?(?:çiş(?:e gittim|imi yaptım| yaptım)?|küçük tuvalet(?:e gittim)?)")))) { add("cis", m[1] ? sayiOku(m[1]) : 1); continue; }

/* Claude'suz mod: "yarın 10:00 dişçi", "cuma saat 9 banka", "bugün 18.30 spor" → o günün planına (gelecekteyse Google Takvim'e de) */
const HAFTA_GUN = ["pazar","pazartesi","salı","çarşamba","perşembe","cuma","cumartesi"];
function planParse(text){
  let t = trLow(text).replace(/\s+/g, " ").replace(/[.!]+$/, "").trim();
  if (!t || /\?/.test(t) || /(\biptal\b|\bsil\b|geri al|yanlış)/.test(t)) return null;
  let saat = null, m;
  const ek = "(?:'?(?:de|da|te|ta|den|dan|ten|tan|e|a|ye|ya))?";
  if ((m = t.match(new RegExp("(^|\\s)(?:saat\\s*)?(\\d{1,2})[:.](\\d{2})" + ek + "(?=\\s|$|,)")))) {
    const h = +m[2], dk = +m[3]; if (h > 23 || dk > 59) return null;
    saat = String(h).padStart(2, "0") + ":" + m[3];
  } else if ((m = t.match(new RegExp("(^|\\s)saat\\s*(\\d{1,2})(\\s*buçuk)?" + ek + "(?=\\s|$|,)")))) {
    const h = +m[2]; if (h > 23) return null;
    saat = String(h).padStart(2, "0") + (m[3] ? ":30" : ":00");
  } else return null;
  t = (t.slice(0, m.index) + " " + t.slice(m.index + m[0].length)).replace(/\s+/g, " ").trim();
  let tarih = S.today;
  const gunRe = /(^|\s)(bugün|yarın|öbür gün|yarından sonra|pazartesi|salı|çarşamba|perşembe|cuma|cumartesi|pazar)('?(?:ye|ya|e|a|günü|gün|sabah|akşam|öğlen)?)?(?=\s|$|,)/;
  if ((m = t.match(gunRe))) {
    const g = m[2];
    if (g === "yarın") tarih = addDays(S.today, 1);
    else if (g === "öbür gün" || g === "yarından sonra") tarih = addDays(S.today, 2);
    else if (g !== "bugün") tarih = addDays(S.today, (HAFTA_GUN.indexOf(g) - dow(S.today) + 7) % 7);
    t = (t.slice(0, m.index) + " " + t.slice(m.index + m[0].length)).replace(/\s+/g, " ").trim();
  }
  let baslik = t.replace(/(^|\s)(plana|programa|takvime|ajandaya)\s+(ekle|yaz|koy)(\s|$)/g, " ")
    .replace(/(^|\s)(hatırlat|hatırlatma|hatırlatır mısın|ekle|yaz|kaydet|lütfen|için)(?=\s|$)/g, " ")
    .replace(/(^|\s)(sabah|akşam|öğlen|öğleden sonra)(?=\s|$)/g, " ").replace(/^[,\s-]+|[,\s-]+$/g, "").replace(/\s+/g, " ").trim();

}

  if (!SR) return;

  /* he wants to talk: silence the app first, otherwise the microphone hears the app's own voice */
  sesDurdur(); if (SES.acik) sesKapat();
  MIC = {baz: "", metin: "", bos: 0, z: null};
  recOn = true; renderSheet();
  micOturum();   /* must start inside the tap on iPhone */
}
function micOturum(){
  const r = new SR(), bas = Date.now(); rec = r; r.lang = "tr-TR"; r.interimResults = true; r.continuous = true;
  r.onresult = e => {
    if (rec !== r) return;
    let t = ""; for (let i = 0; i < e.results.length; i++) t += e.results[i][0].transcript;
    MIC.metin = (MIC.baz ? MIC.baz + " " : "") + t.trim();
    const el = document.getElementById("abInput"); if (el) { el.value = MIC.metin; growInput(); }
    clearTimeout(MIC.z); MIC.z = setTimeout(() => { if (recOn && rec === r) micBitir(true); }, 4000);
  };
  r.onerror = e => {
    if (rec !== r) return;
    if (e.error === "not-allowed" || e.error === "service-not-allowed") { rec = null; recOn = false; S.agent.error = "Mikrofon izni yok. Klavyedeki 🎤 ile söyleyebilirsin."; renderSheet(); }
  };
  r.onend = () => {
    if (rec !== r) return; rec = null;
    if (!recOn) return;
    MIC.baz = MIC.metin;
    MIC.bos = Date.now() - bas < 1200 ? MIC.bos + 1 : 0;
    if (MIC.bos >= 5) { micBitir(true); return; }
    try { micOturum(); } catch (er) { micBitir(true); }
  };
  try { r.start(); } catch (e) { rec = null; recOn = false; renderSheet(); }
}
function micBitir(gonder){
  clearTimeout(MIC.z); const r = rec; rec = null; recOn = false;
  try { if (r) r.abort(); } catch (e) {}
  const t = (MIC.metin || "").trim(); MIC.metin = ""; MIC.baz = "";
  if (gonder && t && yankiMi(t)) { const el = document.getElementById("abInput"); if (el) el.value = ""; S.agent.error = YANKI; renderSheet(); return; }
  renderSheet(); if (gonder && t) runAgent(t);
}

/* alttan açılan pencereler: tutma çubuğundan ya da başlıktan aşağı çekince kapanır; az çekersen geri yaylanır.
   Kapanış, arka plana dokunmakla aynı eylemi çalıştırır (mikrofonu kapatmak gibi temizlikler aynen olur). */
(() => {
  let sh = null, y0 = 0, t0 = 0, dy = 0;
  document.addEventListener("touchstart", e => {
    sh = null; if (e.touches.length !== 1) return;
    const tut = e.target.closest(".sheet .grab, .sheet .card-h"); if (!tut || e.target.closest("button, a, input, textarea, select")) return;
    const p = tut.closest(".sheet"); if (!p || !p.parentElement.querySelector(".sheet-bg[data-act]")) return;
    sh = p; y0 = e.touches[0].clientY; t0 = Date.now(); dy = 0; p.parentElement.classList.remove("acilis"); p.style.transition = "none";
  }, {passive: true});
  document.addEventListener("touchmove", e => {
    if (!sh) return; if (!sh.isConnected) { sh = null; return; }
    dy = Math.max(0, e.touches[0].clientY - y0); sh.style.transform = `translate3d(0,${dy}px,0)`;
  }, {passive: true});
  const birak = () => {
    if (!sh) return; const p = sh; sh = null; if (!p.isConnected) return;
    const hiz = dy / Math.max(1, Date.now() - t0), anim = hareketAcik();
    p.style.transition = anim ? "transform .22s cubic-bezier(.2,.8,.3,1)" : "none";
    if (dy > 110 || (dy > 36 && hiz > 0.55)) {
      p.style.transform = "translate3d(0,105%,0)";
      setTimeout(() => { const bg = p.isConnected && p.parentElement.querySelector(".sheet-bg[data-act]"); if (bg) bg.click(); }, anim ? 190 : 0);
    } else { p.style.transform = ""; setTimeout(() => { if (p.isConnected) p.style.transition = ""; }, 240); }
  };
  document.addEventListener("touchend", birak, {passive: true}); document.addEventListener("touchcancel", birak, {passive: true});
})();

document.addEventListener("input", e => {

const ALAN = {para: {ad: "Para", em: "💰", renk: "#2fbf8a"}, su: {ad: "Su", em: "💧", renk: "#3d9dff"}, sigara: {ad: "Sigara", em: "🚬", renk: "#f2a03d"},
  tuvalet: {ad: "Tuvalet", em: "🚽", renk: "#22b8c2"}, his: {ad: "Nasıl hissediyorum", em: "🙂", renk: "#a68bff"}, uyku: {ad: "Uyku", em: "😴", renk: "#7386ff"}};
const ALAN_RENK = {spor: "#ff7a59", okuma: "#e2b23c", dis: "#4cc9e0", kahve: "#c58b5c", alkol: "#d86aa0", ekran: "#8f9bb3", yuruyus: "#5fcf7a", nefes: "#58c7b0", saglikli: "#7ecb52", sosyal: "#ff7fa3", kilo: "#9aa7ff"};

function alanBilgi(key){
  if (ALAN[key]) return Object.assign({key, tip: key}, ALAN[key]);
  const h = habits().find(x => x.key === key); if (!h) return null;
  return {key, tip: h.type, ad: h.label, em: HAB_EM[key] || "✨", renk: alanRenk(key), lower: !!h.lower};
}

/* ---- veri ---- */
function dDeger(key, date){   /* o günün değeri; kayıt yoksa null */
  const d = S.days[date]; if (!d) return null;
  const c = d.counts || {}, n = v => v == null || v === "" ? null : Number(v) || 0;
  if (key === "uyku") return n(d.sleep);
  if (key === "his") return n(d.mood);
  if (key === "tuvalet") return c.cis == null && c.buyuk == null ? null : (Number(c.cis) || 0) + (Number(c.buyuk) || 0);
  if (key === "para") return (d.para || []).filter(x => x.tip !== "gelir").reduce((a, x) => a + (Number(x.tutar) || 0), 0);
  const h = habits().find(x => x.key === key);
  if (h && h.type === "check") return d.checks && key in d.checks ? (d.checks[key] ? 1 : 0) : null;
  return n(c[key]);
}
const dGunler = (n, son) => Array.from({length: n}, (_, i) => addDays(son || S.sel, i - n + 1));
const dOrt = a => { const v = a.filter(x => x != null); return v.length ? v.reduce((p, q) => p + q, 0) / v.length : null; };
const dDizi = (key, gunler) => gunler.map(g => dDeger(key, g));
function gunHedef(key){
  const h = (S.settings && S.settings.gunHedef) || {};
  if (h[key] != null) return Number(h[key]);
  if (key === "su") return 8;
  if (key === "uyku") return 7.5;
  if (key === "sigara") { const g = Object.values(S.goals || {}).map(x => String(x.title || "")).find(t => /sigara/i.test(t) && /\d+/.test(t)); return g ? Number(g.match(/\d+/)[0]) : null; }
  return null;
}
function hedefTuttu(key, v){
  const a = alanBilgi(key); if (!a || v == null) return false;
  if (a.tip === "check") return v >= 1;
  const h = gunHedef(key); if (h == null) return false;
  return (a.lower || key === "sigara") ? v <= h : v >= h;
}
function dSeri(key){   /* hedefi üst üste tutan gün sayısı; bugün henüz tutmadıysa dünden sayılır */
  let n = 0, g = S.today;
  if (!hedefTuttu(key, dDeger(key, g))) g = addDays(g, -1);
  for (let i = 0; i < 400 && hedefTuttu(key, dDeger(key, g)); i++) { n++; g = addDays(g, -1); }
  return n;
}
/* sayaçlarda + basılan saat de tutulur (gün içi dağılım için): d.iz = {su: ["09:10", …]}. Sigara eskisi gibi d.sigaraSaat'te. */
function izYaz(date, d, once){
  DT.sonKayit = Date.now();
  if (date !== S.today) return;
  const c = d.counts || {};
  for (const k of new Set(Object.keys(c).concat(Object.keys(once || {})))) {
    if (k === "sigara") continue;
    const h = habits().find(x => x.key === k); if (!h || h.type !== "count") continue;
    const a = Number((once || {})[k]) || 0, b = Number(c[k]) || 0; if (a === b) continue;
    d.iz = d.iz || {};
    let l = Array.isArray(d.iz[k]) ? d.iz[k].slice() : [];
    if (b > a) { const s = nowHM(); for (let i = a; i < b && i < a + 20; i++) l.push(s); } else l = l.slice(0, Math.max(0, l.length - (a - b)));
    d.iz[k] = l.slice(-40);

}
const dSaatleri = (key, date) => { const d = S.days[date] || {}; return key === "sigara" ? (d.sigaraSaat || []) : key === "tuvalet" ? ((d.iz || {}).cis || []).concat((d.iz || {}).buyuk || []) : ((d.iz || {})[key] || []); };

function dSaatCubuk(saatler, bosMetin){   /* iki saatlik 12 dilim */

    <div class="card-h" style="margin:0"><div><h2 id="sesT">${SES.bolumler ? "Sohbet" : "Sesli brifing"}</h2><span class="small muted">${esc(SES.kaynak || "")}</span></div><button class="x" data-act="sesbitir" aria-label="Kapat">×</button></div>
    ${SES.bolumler ? `<ol class="sohbet-yol" aria-label="Konular">${SES.bolumler.map((b, i) => `<li class="${i < SES.bi ? "gecti" : i === SES.bi ? "simdi" : ""}"${i === SES.bi ? ' aria-current="step"' : ""}>${esc(b.ad)}</li>`).join("")}</ol>` : ""}
    <button class="orb ${d}${SES.sayiyor ? " sayiyor" : ""}" data-act="${d === "dinliyor" ? "sesgonder" : d === "okuyor" ? "sesatla" : "seskonus"}" aria-label="${esc(etiket)}"><span></span>${d === "dinliyor" ? I.mic : d === "okuyor" ? `<svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/></svg>` : I.mic}</button>
    <p class="orbtxt" aria-live="polite">${esc(etiket)}${d === "okuyor" ? `<br><span class="small muted">Dokunursan okumayı geçip seni dinler</span>` : ""}</p>
    ${d === "dinliyor" ? `<p class="ara" id="sesAra">${esc(SES.ara || "")}</p>
      <div class="chiprow" style="justify-content:center;margin:-4px 0 6px"><button class="chip" data-act="sesgonder">Gönder</button><button class="chip" data-act="seselle" aria-pressed="${!!SES.elle}">${SES.elle ? "Kendim göndereceğim ✓" : "Bekle, düşünüyorum"}</button><button class="chip" data-act="sesduzelt">Düzelt</button></div>` : ""}
    ${SES.hata ? `<p class="small" style="color:var(--amber);margin:0;text-align:center">${esc(SES.hata)}</p>` : ""}
    ${SES.cevaplar.length ? `<div class="reply">${SES.cevaplar.map(c => `<div class="you">${c.bolum ? esc(c.bolum) + " · " : ""}Sen: ${esc(c.t)}</div>${c.ozet ? `<p style="margin:0 0 8px">${esc(c.ozet)}</p>` : `<p style="margin:0 0 4px"></p>`}`).join("")}${SES.bolumler && SES.sohbet.length ? `<p class="small muted" style="margin:6px 0 0">Cevapların sohbet bitince tek mesajda Claude'a gidecek.</p>` : ""}</div>` : ""}
    <details class="sesmetin"><summary>Brifingin yazılı hâli</summary><div class="small" style="white-space:pre-wrap;color:var(--ink-2);margin-top:8px">${esc(SES.metin || "")}</div></details>
    <form class="comprow" id="f-ses"><textarea class="field" id="sesYaz" rows="1" placeholder="Ya da buraya yaz…" aria-label="Yazarak cevap ver"></textarea><button class="btn" aria-label="Gönder">${I.send}</button></form>
    <div class="chiprow" style="justify-content:center">${SES.bolumler && SES.bi < SES.bolumler.length ? `<button class="chip" data-act="sesbolumgec">Bu konuyu geç</button>` : ""}<button class="chip" data-act="sestekrar">Baştan oku</button><button class="chip" data-act="sesbitir">Bitir</button></div>
  </div></div>`;
  sayfaAcilis(el); el.hidden = false;
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  switch (b.dataset.act) {
    case "dinle": sesBaslat(b.dataset.id || null); break;
    case "seskonus": sesDinle(true); break;
    case "sesatla": sesDurdur(); SES.oturum = uid(); sesDinle(true); break;
    case "sesdur": case "sesgonder": sesGonder(); break;
    case "seselle": SES.elle = !SES.elle; sesSessizlik(); renderSes(); break;
    case "sesduzelt": { const t = (SES.ara || "").trim(); sesZamanSil(); const r = sesRec; sesRec = null; try { if (r) r.abort(); } catch (er) {} Object.assign(SES, {durum: "bekle", ara: "", baz: "", sayiyor: false}); renderSes(); const f = document.getElementById("sesYaz"); if (f) { f.value = t; f.focus(); } break; }
    case "sesbolumgec": sesBolumGec(); break;
    case "sestekrar": { sesDurdur(); try { if (sesRec) sesRec.abort(); } catch (er) {} sesRec = null; sesAudioHazirla(); const m = SES.metin; SES.oturum = uid(); SES.durum = "okuyor"; SES.hata = ""; sesZamanSil();
      if (SES.bolumler) { SES.bi = 0; sesBolumOku(); break; }
      renderSes(); seslendir(m + SES_SON, () => sesDinle(false), false, SES.yerel); break; }
    case "sesdene": ttsFormKaydet(); sesDene(); break;
    case "sesbitir": sesKapat(); break;
  }
});
/* save the Ses form (also used by "Sesi dene", so he can try before saving) */
function ttsFormKaydet(){
  const f = document.getElementById("f-tts"); if (!f) return "yok";
  const v = id => (document.getElementById(id) || {}).value || "";
  const anahtar = v("ttsKey").replace(/\s+/g, ""), istek = v("ttsKaynak");
  const once = ttsAyar();
  const yeni = Object.assign({}, once, {kaynak: istek === "gemini" && anahtar ? "gemini" : "cihaz", anahtar, ses: v("ttsSes") || "Achird", uslup: v("ttsUslup") || "nese", hiz: Number(v("ttsHiz")) || 1, cihazSes: v("ttsCihaz")});
  LS.set(K_TTS, yeni);
  if (once.anahtar !== yeni.anahtar) ttsSonHata = "";
  return istek === "gemini" && !anahtar ? "anahtarsiz" : "ok";
}
/* turn Google's English error into what to fix */
function googleHata(m){
  m = String(m || "");
  if (/API key not valid|API_KEY_INVALID/i.test(m)) return "Anahtar geçersiz görünüyor; AI Studio'dan tekrar kopyalayıp yapıştır.";
  if (/^429/.test(m) && /PerDay|per day|daily/i.test(m)) return "Bugünkü ücretsiz doğal ses hakkı doldu; yarın sabah yenilenir.";
  if (/^429|quota|RESOURCE_EXHAUSTED/i.test(m)) return "Kısa sürede çok istek oldu; bir dakika sonra yine doğal sesle.";
  if (/location is not supported|not available in your country/i.test(m)) return "Google bu konumda ücretsiz Gemini sesine izin vermiyor.";
  if (/referer|referrer/i.test(m)) return "Anahtarın site kısıtlaması tutmuyor; kısıtlamayı kaldır ya da “https://ykdikmen.github.io/*” ekle.";
  if (/has not been used|is disabled|SERVICE_DISABLED|not enabled|blocked/i.test(m)) return "Bu anahtarda Gemini API kapalı; AI Studio'dan yeni bir anahtar oluştur.";
  if (/^5\d\d/.test(m)) return "Google'ın ses servisi şu an yanıt vermiyor.";
  if (/Failed to fetch|NetworkError|Load failed/i.test(m)) return "İnternet yok gibi.";
  return "Doğal ses alınamadı (" + m.slice(0, 80) + ").";
}
function sesDene(){
  sesAudioHazirla();
  const ornek = "Selam" + (ayar().ad ? " " + ayar().ad : "") + "! Ben senin hayat koçunum. Bugün su bardağıyla barışıyor muyuz? Turlar yoğun ama sen halledersin, ben de buradayım.";
  SES = {acik: true, oturum: uid(), durum: "okuyor", metin: ornek, kaynak: "Ses denemesi", tur: 0, cevaplar: [], ara: "", hata: ""};
  renderSes();
  seslendir(ornek, () => { sesBitir(); render(); }, true);
}
document.addEventListener("submit", e => {
  if (e.target.id === "f-tts") {
    e.preventDefault(); e.stopImmediatePropagation();
    const r = ttsFormKaydet();
    toast(r === "anahtarsiz" ? "Doğal ses için anahtar gerekli; şimdilik telefonun sesi." : "Ses ayarı kaydedildi."); render(); return;
  }
  if (e.target.id !== "f-ses") return;
  e.preventDefault(); e.stopImmediatePropagation();
  const el = document.getElementById("sesYaz"), t = el ? el.value.trim() : ""; if (!t) return;
  try { if (sesRec) sesRec.abort(); } catch (er) {} sesRec = null;
  sesCevap(t);
}, true);

</script>
