<meta name="mobile-web-app-capable" content="yes">

<script>try{var t=localStorage.getItem("hayat.tema");t=t&&JSON.parse(t);if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t);var r=JSON.parse(localStorage.getItem("hayat.renk")||"null");if(r&&r!=="gece")document.documentElement.setAttribute("data-renk",r)}catch(e){}</script>
<style>
/* Layout: one phone-width column. Scrolling middle, tab bar pinned at the bottom with a centre "Söyle" button.
   Look: Roman night (blue-black) with Vespa mint as the accent and ponentino coral for things that need you.
   The one loud element is the sky card on Bugün; everything else stays quiet. */
:root{
  color-scheme: dark;
  --bg:#0c1118; --bg-2:#0f1620; --surface:#141c27; --surface-2:#1b2533; --surface-3:#222e3f;
  --line:#243042; --line-2:#33425a;
  --ink:#edf1f5; --ink-2:#a9b4c3; --ink-3:#717e90;
  --mint:#7bdcb8; --on-mint:#05261a; --mint-soft:rgba(123,220,184,.14);
  --coral:#ff8d6b; --coral-soft:rgba(255,141,107,.14);
  --amber:#f5b94a; --amber-soft:rgba(245,185,74,.14);
  --sky:#74b4ff; --rose:#f48fb1; --violet:#b39dff; --mood-low:#ff9a5c; --mood-high:#74b4ff;
  --good:#5bd48f; --bad:#ff6f6f;
  --shadow:0 12px 32px rgba(0,0,0,.38);
  --font-display:"Saira Semi Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
  --font-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:20px; --r-sm:13px;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    color-scheme: light;
    --bg:#edf0f4; --bg-2:#f7f8fa; --surface:#ffffff; --surface-2:#f2f4f7; --surface-3:#e8ecf1; --mood-low:#e8692f; --mood-high:#2f7fe0;
    --line:#dfe4eb; --line-2:#cbd3de;
    --ink:#111923; --ink-2:#465366; --ink-3:#77849a;
    --mint:#0c9a72; --on-mint:#ffffff; --mint-soft:rgba(12,154,114,.12);
    --coral:#dd5530; --coral-soft:rgba(221,85,48,.11);
    --amber:#b07214; --amber-soft:rgba(176,114,20,.12);
    --sky:#2c78d6; --rose:#cc4479; --violet:#6f55dc;
    --good:#12924c; --bad:#d23a3a;
    --shadow:0 10px 26px rgba(20,32,52,.10);
  }
}
:root[data-theme="light"]{
  color-scheme: light;
  --bg:#edf0f4; --bg-2:#f7f8fa; --surface:#ffffff; --surface-2:#f2f4f7; --surface-3:#e8ecf1;
  --line:#dfe4eb; --line-2:#cbd3de;
  --ink:#111923; --ink-2:#465366; --ink-3:#77849a;
  --mint:#0c9a72; --on-mint:#ffffff; --mint-soft:rgba(12,154,114,.12);
  --coral:#dd5530; --coral-soft:rgba(221,85,48,.11);
  --amber:#b07214; --amber-soft:rgba(176,114,20,.12);
  --sky:#2c78d6; --rose:#cc4479; --violet:#6f55dc;
  --good:#12924c; --bad:#d23a3a;
  --shadow:0 10px 26px rgba(20,32,52,.10);
}

*{box-sizing:border-box}
html{height:calc(100% + var(--alt-fark, 0px));margin:0}
body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;overflow:hidden;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--mint);outline-offset:2px;border-radius:8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-3)}
.small{font-size:12.5px}

#main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(env(safe-area-inset-top) + 12px) max(16px, env(safe-area-inset-right)) 28px max(16px, env(safe-area-inset-left))}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}

/* ---------- tab bar ---------- */
nav.tabs{flex:none;position:relative;display:grid;grid-template-columns:repeat(5,1fr);align-items:end;background:var(--bg-2);border-top:1px solid var(--line);padding:3px max(6px, env(safe-area-inset-right)) max(4px, calc(env(safe-area-inset-bottom) - 13px)) max(6px, env(safe-area-inset-left))}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0 1px;color:var(--ink-3);text-decoration:none;font-size:10.5px;font-weight:700;letter-spacing:.01em;border-radius:12px}
nav.tabs a svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs a[aria-current="page"]{color:var(--ink)}
nav.tabs a[aria-current="page"] svg{stroke:var(--mint)}
.say{justify-self:center;width:50px;height:50px;margin-top:-16px;border-radius:50%;border:0;background:var(--mint);color:var(--on-mint);display:grid;place-items:center;box-shadow:0 8px 22px rgba(0,0,0,.35),0 0 0 5px var(--bg-2)}
.say svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.say:active{transform:scale(.96)}

/* ---------- headers ---------- */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:4px 2px 2px}
.eyebrow{font-size:11.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--mint)}
h1{font-family:var(--font-display);font-weight:700;font-size:30px;line-height:1.02;margin:3px 0 0;letter-spacing:-.005em;text-wrap:balance}
h2{font-family:var(--font-display);font-weight:600;font-size:19px;line-height:1.15;margin:0;letter-spacing:.005em}
.btnrow{display:flex;gap:8px;flex:none;align-items:center}
.iconbtn{position:relative;width:42px;height:42px;border-radius:14px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink-2);padding:0}
.iconbtn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.badge{position:absolute;top:-5px;right:-5px;min-width:19px;height:19px;padding:0 5px;border-radius:99px;background:var(--coral);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;border:2px solid var(--bg)}

/* ---------- cards ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px}
.card-h .meta{font-size:12.5px;font-weight:600;color:var(--ink-3);white-space:nowrap}
.card.flat{background:transparent;border-style:dashed}
.sub{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin:14px 0 6px}
.sub:first-child{margin-top:0}
.empty{color:var(--ink-3);font-size:13.5px;padding:4px 0;margin:0}
.chiprow{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:700;color:var(--ink-2);white-space:nowrap}
.chip.on{background:var(--mint);color:var(--on-mint);border-color:var(--mint)}
.chip.warn{background:var(--amber-soft);border-color:transparent;color:var(--amber)}
.chip.hot{background:var(--coral-soft);border-color:transparent;color:var(--coral)}
.chip.wrap{white-space:normal;border-radius:12px;line-height:1.35}
.chip.ok{background:var(--mint-soft);border-color:transparent;color:var(--mint)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px}
.seg button{border:0;background:transparent;border-radius:10px;padding:8px 6px;font-size:13px;font-weight:700;color:var(--ink-3)}
.seg button[aria-pressed="true"]{background:var(--surface-3);color:var(--ink)}

.banner{border-radius:14px;padding:11px 13px;font-size:13px;background:var(--amber-soft);color:var(--ink);border:1px solid var(--line)}
.banner.info{background:var(--mint-soft)}

/* ---------- sky hero (Bugün) ---------- */
.sky{position:relative;overflow:hidden;border-radius:26px;padding:18px 18px 0;color:#14202e;isolation:isolate;box-shadow:var(--shadow)}
.sky.dawn{background:linear-gradient(165deg,#ffb48d 0%,#f9d7c3 38%,#a9cdf0 100%)}
.sky.day{background:linear-gradient(165deg,#5aa9f5 0%,#9fd0fb 55%,#e2f2ff 100%)}
.sky.dusk{background:linear-gradient(165deg,#ff9469 0%,#c4609a 52%,#46398a 100%);color:#fff}
.sky.night{background:linear-gradient(165deg,#1d2a5a 0%,#111a3c 55%,#0a0f24 100%);color:#fff}
.sky.night::before{content:"";position:absolute;inset:0;z-index:-1;opacity:.85;background-image:radial-gradient(1.4px 1.4px at 12% 18%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 28% 36%,#fff 50%,transparent 51%),radial-gradient(1.2px 1.2px at 46% 12%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 63% 28%,#fff 50%,transparent 51%),radial-gradient(1.6px 1.6px at 78% 10%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 90% 34%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 55% 44%,#fff 50%,transparent 51%),radial-gradient(1.2px 1.2px at 8% 46%,#fff 50%,transparent 51%)}
.sky.night .moon,.sky.dusk .moon{display:block}
.moon{display:none;position:absolute;right:76px;top:22px;width:22px;height:22px;border-radius:50%;box-shadow:-6px 4px 0 0 #fff4d6;z-index:-1;opacity:.9}
.sky-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.sky .hello{font-family:var(--font-display);font-weight:700;font-size:33px;line-height:1;letter-spacing:-.01em}
.sky .date{white-space:nowrap;display:flex;align-items:center;gap:2px;font-size:13.5px;font-weight:700;margin-top:6px;margin-left:-8px}
.sky .date span{opacity:.8;padding:0 2px}
.daynav{width:30px;height:30px;border:0;border-radius:10px;background:transparent;color:inherit;display:grid;place-items:center;padding:0;opacity:.8}
.daynav svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.sky .iconbtn{background:rgba(255,255,255,.28);border-color:rgba(255,255,255,.35);color:inherit;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.sky .badge{border-color:transparent}
.sky-mid{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;margin-top:12px}
.gauge text{font-family:var(--font-display)}
.sky-stats{display:grid;gap:7px;min-width:0}
.sstat{display:flex;justify-content:space-between;align-items:baseline;gap:8px;border-bottom:1px solid rgba(255,255,255,.28);padding-bottom:6px;min-width:0}
.sky.dawn .sstat,.sky.day .sstat{border-bottom-color:rgba(20,32,46,.14)}
.sstat:last-child{border-bottom:0;padding-bottom:0}
.sstat span{font-size:12.5px;font-weight:700;opacity:.75;white-space:nowrap}
.sstat b{font-family:var(--font-display);font-size:18px;font-weight:700;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sky-acts{display:flex;gap:8px;margin-top:14px;align-items:stretch}
.sky-acts .dinle{margin-left:auto;height:auto;min-height:44px}
.next{text-decoration:none;display:flex;align-items:center;gap:10px;margin:0;flex:1;min-width:0;padding:10px 12px;border-radius:15px;background:rgba(255,255,255,.34);font-size:14px;font-weight:700;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:0;color:inherit;width:100%;text-align:left}
.sky.dusk .next,.sky.night .next{background:rgba(255,255,255,.14)}
.next .t{font-family:var(--font-display);font-size:17px;flex:none}
.next .w{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.next .in{flex:none;font-size:12px;opacity:.75}
.skyline{display:block;width:calc(100% + 36px);margin:10px -18px 0;height:58px;color:rgba(14,22,40,.30)}
.sky.dusk .skyline{color:rgba(30,18,60,.55)}
.sky.night .skyline{color:rgba(3,6,18,.75)}

/* ---------- lists / plan timeline ---------- */
ul.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
ul.list li{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);min-width:0}
ul.list li:last-child{border-bottom:0}
.check{width:28px;height:28px;border-radius:9px;border:2px solid var(--line-2);background:transparent;display:grid;place-items:center;flex:none;padding:0;transition:background .15s,border-color .15s}
.check svg{width:16px;height:16px;stroke:var(--on-mint);stroke-width:3;fill:none;opacity:0;stroke-linecap:round;stroke-linejoin:round}
.check[aria-pressed="true"]{background:var(--mint);border-color:var(--mint)}
.check[aria-pressed="true"] svg{opacity:1}
.li-time{font-family:var(--font-display);font-variant-numeric:tabular-nums;font-weight:600;color:var(--ink-2);font-size:16px;min-width:44px}
.li-time.late{color:var(--amber)}
.li-text{flex:1;min-width:0;overflow-wrap:anywhere}
li.done .li-text{color:var(--ink-3);text-decoration:line-through;text-decoration-color:var(--line-2)}
li.done .li-time{color:var(--ink-3)}
.x{border:0;background:transparent;color:var(--ink-3);width:32px;height:32px;border-radius:9px;flex:none;font-size:19px;line-height:1;padding:0}
.bell{border:0;background:transparent;color:var(--ink-3);width:32px;height:32px;border-radius:9px;flex:none;display:grid;place-items:center;padding:0}
.bell svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.bell.on{color:var(--mint)}
.bell.on svg{fill:var(--mint-soft)}
.nowline{display:flex;align-items:center;gap:8px;color:var(--coral);font-size:11.5px;font-weight:800;letter-spacing:.06em;padding:4px 0}
.nowline::after{content:"";flex:1;height:2px;border-radius:2px;background:var(--coral);opacity:.6}

form.add{display:flex;gap:8px;margin-top:12px}
.field{background:var(--surface-2);border:1px solid var(--line);border-radius:13px;padding:11px 12px;min-width:0;color:var(--ink);font-size:16px}
.field::placeholder{color:var(--ink-3)}
form.add .grow{flex:1}
input[type=time].field{width:100px;flex:none;padding:10px 8px}
input[type=date].field{min-width:0}
.btn{background:var(--mint);color:var(--on-mint);border:0;border-radius:13px;padding:11px 15px;font-weight:800;flex:none}
.btn.ghost{background:transparent;color:var(--ink-2);border:1px solid var(--line)}
.btn.soft{background:var(--surface-3);color:var(--ink)}
.btn:disabled{opacity:.5}
.btn.wide{width:100%}
textarea.field{width:100%;resize:vertical;min-height:76px;line-height:1.45}
.minibtn{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;min-width:38px;height:34px;font-weight:700;font-size:13px;padding:0 10px;color:var(--ink)}
.minibtn.danger{color:var(--bad)}
a.minibtn{display:inline-flex;align-items:center;text-decoration:none}
.linkbtn{text-decoration:none;border:0;background:transparent;color:var(--mint);font-weight:800;font-size:13.5px;padding:6px 0}

/* ---------- tours (short) ---------- */
.tline{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.tline b{font-family:var(--font-display);font-size:22px;font-weight:700}
.tline span{color:var(--ink-2);font-weight:600}
.tours{margin-top:10px;border-top:1px solid var(--line)}
.tour{display:grid;grid-template-columns:46px 1fr auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.tour:last-child{border-bottom:0}
.tour .t{font-family:var(--font-display);font-variant-numeric:tabular-nums;font-weight:600;font-size:16px}
.tour .n{font-weight:700;overflow-wrap:anywhere;font-size:14px}
.tour .d{font-size:12.5px;color:var(--ink-3)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:800;border-radius:999px;padding:3px 9px;white-space:nowrap}
.pill.ok{background:var(--mint-soft);color:var(--mint)}
.pill.wait{background:var(--amber-soft);color:var(--amber)}
.pill.hot{background:var(--coral-soft);color:var(--coral)}

/* ---------- posta / claude ---------- */
.mail{display:grid;grid-template-columns:12px 1fr;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);align-items:start}
.mail:last-child{border-bottom:0}
.mail i{width:10px;height:10px;border-radius:50%;margin-top:6px;background:var(--ink-3)}
.mail.r i{background:var(--coral);box-shadow:0 0 0 4px var(--coral-soft)}
.mail.o i{background:var(--amber)}
.mail.b i{background:var(--sky)}
.mail.w i{background:var(--line-2)}
.mail .mt{min-width:0;overflow-wrap:anywhere;font-size:14px}
.mail.w .mt{color:var(--ink-3);font-size:13px}
a.lnk{color:var(--mint);font-weight:800;text-decoration:none;white-space:nowrap}
.md p{margin:0 0 7px}.md p:last-child{margin:0}
.md ul{margin:4px 0 7px;padding-left:18px}
.md .mh{font-weight:800}
.brief{position:relative}
.brief .md{max-height:7.5em;overflow:hidden;-webkit-mask-image:linear-gradient(#000 60%,transparent);mask-image:linear-gradient(#000 60%,transparent)}
.brief.open .md{max-height:none;-webkit-mask-image:none;mask-image:none}
.who{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-bottom:8px}
.who .dot{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;background:var(--mint-soft);color:var(--mint)}
.who .dot svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

.feed{display:flex;flex-direction:column;gap:10px}
.fitem{display:grid;grid-template-columns:36px 1fr;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px}
.fitem.unread{border-color:var(--line-2);box-shadow:inset 3px 0 0 var(--coral)}
.ficon{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:var(--surface-3);color:var(--ink-2)}
.ficon svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ficon.posta{background:var(--coral-soft);color:var(--coral)}
.ficon.brifing{background:var(--mint-soft);color:var(--mint)}
.ficon.uyari{background:var(--amber-soft);color:var(--amber)}
.ficon.claude{background:rgba(116,180,255,.14);color:var(--sky)}
.fbody{min-width:0}
.fhead{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.fhead b{font-size:14px}
.fhead span{font-size:11.5px;color:var(--ink-3);white-space:nowrap}
.fbody .md{font-size:14px;color:var(--ink-2);margin-top:3px}

.msgs{display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;border-radius:18px;padding:10px 13px;font-size:14.5px;overflow-wrap:anywhere}
.msg.u{align-self:flex-end;background:var(--mint);color:var(--on-mint);border-bottom-right-radius:6px;white-space:pre-wrap}
.msg.a{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:6px}
.msg .when{display:block;font-size:11px;opacity:.65;margin-top:4px;text-align:right}
.msg.a .who2{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin:0 0 4px}
.msg.a.pending{border-style:dashed;color:var(--ink-2)}
.acts{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}

/* ---------- habits ---------- */
.habchecks{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.habchip{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface-2);border-radius:13px;padding:9px 13px;font-weight:700;font-size:14px}
.habchip .dot{width:17px;height:17px;border-radius:6px;border:2px solid var(--line-2);display:grid;place-items:center}
.habchip[aria-pressed="true"]{border-color:transparent;background:var(--mint-soft);color:var(--mint)}
.habchip[aria-pressed="true"] .dot{background:var(--mint);border-color:var(--mint)}
.counters{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.counter{background:var(--surface-2);border-radius:14px;padding:9px 10px 10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.counter .lbl{font-size:12.5px;font-weight:700;color:var(--ink-2);line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stepper{display:flex;align-items:center;justify-content:space-between;gap:4px}
.stepper button{width:42px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--surface);font-size:19px;font-weight:700;color:var(--ink);padding:0}
.stepper output{min-width:30px;text-align:center;font-family:var(--font-display);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.olcum{display:flex;gap:6px;align-items:center}
.olcum input{width:100%;text-align:center;font-family:var(--font-display);font-size:20px;font-weight:700;padding:6px}

/* sliders */
.slider{display:grid;grid-template-columns:84px 1fr 30px;gap:10px;align-items:center;padding:7px 0}
.slider label{font-weight:700;font-size:13.5px;display:flex;align-items:center;gap:7px}
.slider label i{width:10px;height:10px;border-radius:50%;display:inline-block}
.slider output{text-align:right;font-family:var(--font-display);font-weight:700;font-size:20px;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--mint);height:30px}
input[type=range].unset{opacity:.35}

/* ---------- money ---------- */
.money-hero{display:grid;gap:12px}
.mbig{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.mbig b{font-family:var(--font-display);font-size:42px;font-weight:700;line-height:1;letter-spacing:-.01em}
.mbig span{color:var(--ink-3);font-weight:700;font-size:13px}
.mrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mtile{background:var(--surface-2);border-radius:14px;padding:10px 12px}
.mtile span{display:block;font-size:12px;font-weight:700;color:var(--ink-3)}
.mtile b{font-family:var(--font-display);font-size:22px;font-weight:700}
.mtile.in b{color:var(--mint)}
.mtile.out b{color:var(--coral)}
.budget{display:grid;gap:6px}
.budget .bar{height:10px}
.bar{height:8px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--mint)}
.bar i.warn{background:var(--amber)}
.bar i.over{background:var(--coral)}
.amount{display:flex;align-items:center;gap:6px;background:var(--surface-2);border:1px solid var(--line);border-radius:16px;padding:6px 14px}
.amount span{font-family:var(--font-display);font-size:30px;font-weight:700;color:var(--ink-3)}
.amount input{flex:1;min-width:0;border:0;background:transparent;font-family:var(--font-display);font-size:34px;font-weight:700;padding:4px 0;color:var(--ink)}
.amount input:focus{outline:none}
.amount:focus-within{border-color:var(--mint)}
.cats{display:flex;flex-wrap:wrap;gap:7px}
.cat{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:8px 11px;font-size:13px;font-weight:700;color:var(--ink-2)}
.cat i{width:9px;height:9px;border-radius:50%}
.cat[aria-pressed="true"]{border-color:var(--ink-2);color:var(--ink);background:var(--surface-3)}
.formstack{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.formgrid .field{width:100%}
.formgrid .full{grid-column:1/-1}
.lbl{display:grid;gap:5px;font-size:12.5px;font-weight:700;color:var(--ink-2)}
.lbl .field{width:100%;font-weight:500;color:var(--ink)}
.catrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:7px 0;align-items:center}
.catrow .nm{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;min-width:0}
.catrow .nm i{width:10px;height:10px;border-radius:3px;flex:none}
.catrow .v{font-family:var(--font-display);font-weight:700;font-size:16px;text-align:right}
.catrow .bar{grid-column:1/-1;height:6px}
.tx{display:grid;grid-template-columns:10px 1fr auto auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.tx:last-child{border-bottom:0}
.tx i{width:10px;height:10px;border-radius:3px}
.tx .w{min-width:0}
.tx .w b{display:block;font-size:14px;overflow-wrap:anywhere}
.tx .w span{font-size:12px;color:var(--ink-3)}
.tx .a{font-family:var(--font-display);font-weight:700;font-size:17px;font-variant-numeric:tabular-nums}
.tx .a.in{color:var(--mint)}
.insight{display:grid;grid-template-columns:22px 1fr;gap:8px;padding:7px 0;font-size:14px;align-items:start}
.insight svg{width:18px;height:18px;stroke:var(--mint);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;margin-top:2px}
.insight.warn svg{stroke:var(--amber)}

/* ---------- journal ---------- */
.jq{display:grid;gap:6px;margin-bottom:12px}
.jq:last-child{margin-bottom:0}
.jq label{font-size:13px;font-weight:700;color:var(--ink-2)}
.jq input.field,.jq textarea.field{width:100%}
.sleepset{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sleepset label{display:grid;gap:5px;font-size:12.5px;font-weight:700;color:var(--ink-2)}
.sleepset input{width:100%}
.sleepsum{display:flex;align-items:baseline;gap:8px;margin-top:10px}
.sleepsum b{font-family:var(--font-display);font-size:26px;font-weight:700}
.past{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);width:100%;border-left:0;border-right:0;border-top:0;background:transparent;text-align:left}
.past:last-child{border-bottom:0}
.past .d{font-family:var(--font-display);font-weight:700;font-size:15px;line-height:1.1}
.past .d small{display:block;font-family:var(--font-body);font-size:11px;font-weight:700;color:var(--ink-3)}
.past .s{font-size:13px;color:var(--ink-2);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.moodot{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-family:var(--font-display);font-weight:700;font-size:15px;background:var(--surface-3);color:var(--ink-2)}

/* ---------- week & habit grid ---------- */
.weekrings{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.wr svg{width:100%;max-width:42px;height:auto}
.wr{display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:transparent;padding:5px 0;border-radius:12px;color:inherit}
.wr .a{font-size:11.5px;font-weight:800;color:var(--ink-2)}
.wr .b{font-size:11px;color:var(--ink-3)}
.wr.today{background:var(--surface-2)}
.ring text{font-family:var(--font-display);font-weight:700;fill:var(--ink)}
.bigpct{display:flex;align-items:baseline;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.bigpct b{font-family:var(--font-display);font-size:40px;font-weight:700;line-height:1}
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .ax{fill:var(--ink-3);font-size:10.5px;font-family:var(--font-body)}
.chart .lab{font-size:11px;font-weight:700;font-family:var(--font-body);fill:var(--ink-2)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;font-weight:700;color:var(--ink-2);margin-bottom:6px}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:12px;height:3px;border-radius:2px;display:inline-block}
.legend i.sq{height:10px;width:10px;border-radius:3px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--surface-2);border-radius:13px;padding:10px}
.kpi b{display:block;font-family:var(--font-display);font-size:22px;font-weight:700;line-height:1.1}
.kpi span{font-size:12px;color:var(--ink-3);font-weight:700}
.rows{display:grid}
.row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px;align-items:center}
.row:last-child{border-bottom:0}
.row b{font-variant-numeric:tabular-nums;text-align:right}
.gridwrap{overflow-x:auto;margin:0 -16px;padding:0 16px}
table.hg{border-collapse:separate;border-spacing:3px;font-size:11px}
table.hg th{font-weight:700;color:var(--ink-3);text-align:center;padding:0 0 2px}
table.hg th.rowh{text-align:left;color:var(--ink-2);font-size:12px;padding-right:6px;white-space:nowrap;position:sticky;left:-16px;background:var(--surface);z-index:1}
table.hg th.tcol{color:var(--mint)}
table.hg td{width:24px;min-width:24px;height:24px;border-radius:7px;text-align:center;vertical-align:middle;padding:0;font-weight:700;font-variant-numeric:tabular-nums}
td.c0{border:1px solid var(--line)}
td.c1{background:var(--mint)}
td.fut{opacity:.25}
td button{width:100%;height:100%;border:0;background:transparent;padding:0;border-radius:7px;color:var(--ink);font-weight:700;font-size:11px}
td.c1 button{color:var(--on-mint)}
.goal{padding:12px 0;border-bottom:1px solid var(--line);display:grid;gap:8px}
.goal:last-child{border-bottom:0}
.goal .gt{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.goal .title{font-weight:800;overflow-wrap:anywhere}
.goal .gnext{font-size:13px;color:var(--ink-2)}
.area{font-size:11px;font-weight:800;border-radius:7px;padding:2px 8px;background:var(--surface-3);color:var(--ink-2);white-space:nowrap}
.gctl{display:flex;align-items:center;gap:8px}
.gctl .bar{flex:1}
.gctl b{min-width:40px;text-align:right;font-variant-numeric:tabular-nums}
.focusgrp h3{font-size:12px;margin:14px 0 2px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.08em}
.focusgrp h3:first-child{margin-top:0}
.sugg{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:10px 0;border-bottom:1px solid var(--line);align-items:center}
.sugg:last-child{border-bottom:0}
.sugg b{font-size:14px}
.sugg p{grid-column:1/2;margin:0;font-size:12.5px;color:var(--ink-3)}
.sugg .minibtn{grid-row:1/3;grid-column:2}

/* ---------- composer sheet ---------- */
.sheet-bg{position:fixed;inset:0;z-index:40;background:rgba(4,8,14,.55);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--surface);border-top:1px solid var(--line);border-radius:24px 24px 0 0;padding:10px max(16px, env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 14px) max(16px, env(safe-area-inset-left));box-shadow:0 -12px 40px rgba(0,0,0,.35);max-height:88vh;overflow:auto}
.sheet-in{max-width:560px;margin:0 auto;display:grid;gap:12px}
.grab{width:42px;height:5px;border-radius:9px;background:var(--line-2);margin:2px auto 4px}
.sheet h2{font-size:22px}
.comprow{display:flex;gap:8px;align-items:flex-end}
.comprow textarea{flex:1;min-height:52px;max-height:150px;resize:none;font-size:16px}
.comprow .btn{height:52px;min-width:52px;padding:0 14px;display:grid;place-items:center}
.comprow .btn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.comprow .btn.mic.on{background:var(--bad);color:#fff}
.reply{background:var(--surface-2);border-radius:15px;padding:12px 13px;font-size:14.5px}
.reply .you{color:var(--ink-3);font-size:12.5px;margin-bottom:5px;overflow-wrap:anywhere}
.reply.err{color:var(--bad)}
.hint{font-size:12.5px;color:var(--ink-3);margin:0}

/* ---------- misc ---------- */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 72px);z-index:50;background:var(--ink);color:var(--bg);font-weight:700;font-size:14px;padding:10px 16px;border-radius:14px;box-shadow:var(--shadow);max-width:min(92vw,480px);text-align:center;animation:pop .25s ease-out}
@keyframes pop{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
.tip{position:fixed;z-index:30;pointer-events:none;background:var(--surface-3);border:1px solid var(--line-2);border-radius:10px;padding:8px 10px;font-size:12.5px;box-shadow:var(--shadow);max-width:220px}
.tip b{display:block;margin-bottom:2px}
.giris{position:fixed;inset:0;z-index:60;background:var(--bg);overflow:auto;padding:calc(env(safe-area-inset-top) + 32px) 20px 32px}
.giris[hidden]{display:none}
.giris-kart{max-width:480px;margin:0 auto;display:grid;gap:12px}
.giris-kart textarea{width:100%;font-size:15px;word-break:break-all}
.calchk{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2);margin-top:10px}
.calchk input{width:18px;height:18px;accent-color:var(--mint)}
.sp{height:4px}

/* ---------- Dinle (voice briefing) ---------- */
.dinle{display:inline-flex;align-items:center;gap:6px;height:42px;padding:0 14px 0 11px;border-radius:14px;border:0;background:#fff;color:#14202e;font-weight:800;font-size:14px;box-shadow:0 6px 16px rgba(0,0,0,.18)}
.dinle svg{width:15px;height:15px;fill:currentColor;stroke:none}
.sky.dusk .dinle,.sky.night .dinle{background:var(--mint);color:var(--on-mint)}
.sesk .sheet-in{gap:14px}
.orb{position:relative;justify-self:center;width:132px;height:132px;border-radius:50%;border:0;display:grid;place-items:center;color:var(--on-mint);background:var(--mint);margin:6px 0 0;isolation:isolate}
.orb svg{width:44px;height:44px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.orb span{position:absolute;inset:-10px;border-radius:50%;z-index:-1;background:var(--mint-soft)}
.orb.okuyor span{animation:nefes 2.4s ease-in-out infinite}
.orb.dinliyor{background:var(--coral);color:#fff}
.orb.dinliyor span{background:var(--coral-soft);animation:nefes 1.1s ease-in-out infinite}
.orb.bekle,.orb.bitti{background:var(--surface-3);color:var(--ink)}
.orb.bekle span,.orb.bitti span{background:transparent}
@keyframes nefes{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(1.14);opacity:.45}}
.orbtxt{text-align:center;margin:0;font-weight:800;font-size:16px}
.ara{text-align:center;margin:0;min-height:1.4em;color:var(--ink-2);font-size:15px}
.sesmetin summary{cursor:pointer;font-size:13px;font-weight:700;color:var(--ink-3)}
.sky-acts .dinle:only-child{flex:1;justify-content:center}

/* 2.6 canlılık */
.gauge-btn{background:none;border:0;padding:0;margin:0;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;border-radius:16px;line-height:0}
.gauge-btn:active{transform:scale(.97)}
.gauge-btn:focus-visible{outline:2px solid var(--sky);outline-offset:3px}
#fx{position:fixed;inset:0;pointer-events:none;z-index:80;overflow:hidden}
#fx i{position:fixed;display:block}
.fx-duman{width:30px;height:30px;border-radius:50%;background:radial-gradient(circle,rgba(226,231,238,.75) 0%,rgba(205,212,222,.35) 42%,rgba(205,212,222,0) 70%);filter:blur(1.5px);opacity:0;animation:fxDuman 2s ease-out forwards}
@keyframes fxDuman{0%{transform:translate(0,0) scale(.35);opacity:0}14%{opacity:.9}100%{transform:translate(var(--dx),-96px) scale(2.7);opacity:0}}
.fx-damla{width:14px;height:14px;background:var(--sky);border-radius:0 50% 50% 50%;transform:rotate(45deg);animation:fxDamla .5s cubic-bezier(.55,0,1,.45) forwards}
@keyframes fxDamla{0%{transform:translateY(-48px) rotate(45deg) scale(.6);opacity:0}25%{opacity:1}100%{transform:translateY(0) rotate(45deg) scale(1);opacity:.9}}
.fx-halka{width:36px;height:36px;border-radius:50%;border:2px solid var(--sky);opacity:0;animation:fxHalka .8s ease-out forwards}
@keyframes fxHalka{0%{transform:scale(.25);opacity:.9}100%{transform:scale(2.1);opacity:0}}
.fx-arti{font-style:normal;font:800 14px/1 var(--font-display);color:var(--ink-2);animation:fxArti .85s ease-out forwards}
.fx-arti::before{content:"+1"}
@keyframes fxArti{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(-34px);opacity:0}}
.fx-konfeti{width:7px;height:10px;border-radius:2px;opacity:0;animation:fxKonfeti 1.25s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes fxKonfeti{0%{transform:translate(0,0) rotate(0);opacity:1}55%{opacity:1}100%{transform:translate(var(--dx),calc(var(--dy) + 120px)) rotate(var(--r));opacity:0}}
.sig-ust{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.sig-sure{font:700 30px/1.1 var(--font-display);letter-spacing:-.01em}
.sig-bar{height:8px;border-radius:5px;background:var(--surface-3);overflow:hidden;margin:10px 0 8px}
.sig-bar i{display:block;height:100%;border-radius:5px;background:var(--mint);transition:width .6s ease}
.sig-not{margin:0;color:var(--ink-2)}
.karne-ust{display:flex;gap:14px;align-items:center;margin-bottom:10px}
.karne-not{width:78px;height:78px;border-radius:50%;display:grid;place-items:center;align-content:center;background:var(--mint-soft);border:2px solid var(--mint);flex:none}
.karne-not b{font:700 28px/1 var(--font-display)}
.karne-not span{font-size:12px;font-weight:800;color:var(--mint);margin-top:2px}
.karne-yorum{display:grid;gap:3px}
.karne-satir{display:grid!important;grid-template-columns:76px 1fr auto;align-items:center;gap:10px}
.karne-p{height:6px;border-radius:4px;background:var(--surface-3);overflow:hidden}
.karne-p i{display:block;height:100%;background:var(--ink-3);border-radius:4px}
.karne-satir b{text-align:right;font-size:13.5px}
.karne-satir small{display:block;font-weight:700;font-size:11.5px}
.karne-satir small.iyi{color:var(--mint)}
.karne-satir small.kotu{color:var(--mood-low)}
.ruh-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.ruh-b{font-size:11px;font-weight:700;color:var(--ink-3);text-align:center;padding-bottom:2px}
.ruh-g{aspect-ratio:1;border:0;border-radius:9px;background:var(--surface-2);color:var(--ink);display:grid;place-items:center;align-content:center;padding:0;font:600 13px/1 var(--font-display);position:relative}
.ruh-g small{font-size:10px;font-weight:800;opacity:.85;margin-top:2px}
.ruh-g.bugun{outline:2px solid var(--ink-2);outline-offset:-2px}
.ruh-g.gelecek{opacity:.4}
.ruh-lej{display:flex;align-items:center;gap:8px;margin-top:10px}
.ruh-lej i{flex:1;height:8px;border-radius:5px}
.gk-metin{width:100%;min-height:110px;resize:vertical;line-height:1.45}
.gk-metin[readonly]{border-color:var(--rose)}
.gk-ara{min-height:1em;margin:4px 2px 8px;font-size:13px;color:var(--ink-3);font-style:italic}
.gk-dug{display:flex;gap:8px;flex-wrap:wrap}
.gk-dug .btn{display:inline-flex;align-items:center;gap:6px}
.gk-dug .btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.gk-dug{align-items:center}
.gk-temiz{color:var(--ink-3)!important;margin-left:4px}
.gk-kayit{background:var(--rose)!important;color:#2a0b16!important}
.gk-canli{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--rose);margin:0 0 8px}
.gk-nokta{width:10px;height:10px;border-radius:50%;background:var(--rose);animation:gkNabiz 1.1s ease-in-out infinite}
@keyframes gkNabiz{0%,100%{transform:scale(.8);opacity:.6}50%{transform:scale(1.25);opacity:1}}
.gk-liste{margin-top:12px}
.gk-liste .li-text{white-space:pre-wrap}
.gk-durum{font-size:11.5px;font-weight:700;color:var(--ink-3);flex:none}
.gk-durum a{color:var(--mint)}
.btur{display:grid;gap:2px}
.btur-s{display:flex;gap:12px;align-items:center;padding:9px 2px;border-bottom:1px solid var(--line)}
.btur-s:last-child{border-bottom:0}
.btur-s input{width:22px;height:22px;accent-color:var(--mint);flex:none}
.btur-s span{display:grid;gap:1px}
.btur-s small{color:var(--ink-3);font-size:12px}

/* 2.7 hareket ve temalar */
:root{--a1:rgba(123,220,184,.13);--a2:rgba(116,180,255,.13);--a3:rgba(179,157,255,.10);--cam:color-mix(in oklab,var(--surface) 80%,transparent);--parilti:rgba(255,255,255,.05)}
:root[data-theme="light"]{--a1:rgba(12,154,114,.10);--a2:rgba(44,120,214,.12);--a3:rgba(255,255,255,.7);--parilti:rgba(255,255,255,.7)}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--a1:rgba(12,154,114,.10);--a2:rgba(44,120,214,.12);--a3:rgba(255,255,255,.7);--parilti:rgba(255,255,255,.7)}}
:root[data-renk="orman"]{color-scheme:dark;
  --bg:#0b1511;--bg-2:#0e1a15;--surface:#13221b;--surface-2:#1a2c23;--surface-3:#22382d;--line:#24382e;--line-2:#335043;
  --ink:#eef5ef;--ink-2:#a9bfb0;--ink-3:#73897b;--mint:#b5dd9a;--on-mint:#13240f;--mint-soft:rgba(181,221,154,.14);
  --coral:#ff9a76;--coral-soft:rgba(255,154,118,.14);--amber:#e8c46a;--amber-soft:rgba(232,196,106,.14);
  --sky:#8cc7e0;--rose:#f0a0b8;--violet:#c3b3ff;--mood-low:#ff9a5c;--mood-high:#8cc7e8;--good:#7fd99a;--bad:#ff7a7a;
  --shadow:0 14px 34px rgba(0,0,0,.42);--a1:rgba(120,200,130,.20);--a2:rgba(40,150,110,.20);--a3:rgba(210,235,170,.08);--parilti:rgba(220,255,220,.06)}
:root[data-renk="kum"]{color-scheme:light;
  --bg:#efe7dc;--bg-2:#f6f0e8;--surface:#fcf9f4;--surface-2:#f2ebe1;--surface-3:#e8dfd2;--line:#e3d9cb;--line-2:#d3c6b4;
  --ink:#2a231e;--ink-2:#6a5e53;--ink-3:#9a8c7e;--mint:#de5f27;--on-mint:#ffffff;--mint-soft:rgba(222,95,39,.12);
  --coral:#c84a3c;--coral-soft:rgba(200,74,60,.11);--amber:#b07a14;--amber-soft:rgba(176,122,20,.12);
  --sky:#3f78b3;--rose:#c45a7c;--violet:#7a62c9;--mood-low:#d9622b;--mood-high:#3f7fc4;--good:#3c9258;--bad:#c93b3b;
  --shadow:0 12px 30px rgba(80,55,30,.12);--a1:rgba(236,140,80,.22);--a2:rgba(214,176,128,.26);--a3:rgba(255,255,255,.65);--parilti:rgba(255,255,255,.75)}
:root[data-renk="bulut"]{color-scheme:light;
  --bg:#e8eef7;--bg-2:#f4f7fc;--surface:#ffffff;--surface-2:#f1f5fb;--surface-3:#e4ebf5;--line:#dbe3ef;--line-2:#c7d2e2;
  --ink:#0f1d33;--ink-2:#44536b;--ink-3:#7686a0;--mint:#1d4f9e;--on-mint:#ffffff;--mint-soft:rgba(29,79,158,.10);
  --coral:#d6563a;--coral-soft:rgba(214,86,58,.10);--amber:#a97412;--amber-soft:rgba(169,116,18,.11);
  --sky:#2a84d8;--rose:#c94a7e;--violet:#6a55d8;--mood-low:#e06a2c;--mood-high:#2a78d6;--good:#16935a;--bad:#d23a3a;
  --shadow:0 12px 30px rgba(20,45,90,.10);--a1:rgba(110,165,240,.28);--a2:rgba(170,205,250,.34);--a3:rgba(255,255,255,.7);--parilti:rgba(255,255,255,.8)}
/* arka plan ışıkları */
#aura{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#aura i{position:absolute;width:78vmax;height:78vmax;border-radius:50%;background:radial-gradient(closest-side,var(--a1),transparent);animation:aura 32s ease-in-out infinite alternate;will-change:transform}
#aura i:nth-child(2){background:radial-gradient(closest-side,var(--a2),transparent)}
#aura i:nth-child(3){width:62vmax;height:62vmax;background:radial-gradient(closest-side,var(--a3),transparent)}
@keyframes aura{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(var(--x),var(--y),0) scale(1.2)}}
#main{position:relative;z-index:1}
/* cam kartlar */
.card{background:var(--cam);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);box-shadow:inset 0 1px 0 var(--parilti)}
nav.tabs{background:color-mix(in oklab,var(--bg-2) 84%,transparent);-webkit-backdrop-filter:blur(20px) saturate(1.5);backdrop-filter:blur(20px) saturate(1.5)}
html.sade #aura{display:none}
html.sade .card{background:var(--surface);-webkit-backdrop-filter:none;backdrop-filter:none}
@media (prefers-reduced-transparency: reduce){#aura{display:none}.card{background:var(--surface);-webkit-backdrop-filter:none;backdrop-filter:none}}
/* sayfa girişi */
#view.gir > *{animation:giris .62s cubic-bezier(.16,.84,.3,1) both;animation-delay:calc(var(--i,0) * 50ms)}
@keyframes giris{from{opacity:0;transform:translate3d(var(--gx,0),22px,0) scale(.985)}to{opacity:1;transform:none}}
/* menü göstergesi */
nav.tabs .gosterge{position:absolute;top:3px;left:0;width:52px;height:30px;border-radius:15px;background:var(--mint-soft);transition:transform .5s cubic-bezier(.3,1.35,.5,1),opacity .2s;pointer-events:none;z-index:0}
nav.tabs a{position:relative;z-index:1;transition:transform .2s cubic-bezier(.3,1.5,.5,1),color .2s}
nav.tabs a.zipla svg{animation:zipla .55s cubic-bezier(.3,1.6,.5,1)}
@keyframes zipla{0%{transform:scale(.7) translateY(3px)}55%{transform:scale(1.18) translateY(-2px)}100%{transform:none}}
/* dokunuş */
.btn,.chip,.seg button,.check,[data-act=cnt],.ruh-g,.renk{position:relative;overflow:hidden}
.dalga{position:absolute;border-radius:50%;background:currentColor;opacity:.2;transform:scale(0);animation:dalga .6s ease-out forwards;pointer-events:none}
@keyframes dalga{to{transform:scale(1);opacity:0}}
.btn,.chip,.seg button,.iconbtn,.check,[data-act=cnt],.ruh-g,.renk,.say,.gk-dug .btn{transition:transform .2s cubic-bezier(.3,1.5,.5,1),background-color .2s,color .2s}
.btn:active,.chip:active,.seg button:active,.iconbtn:active,.check:active,[data-act=cnt]:active,.ruh-g:active,.renk:active{transform:scale(.93)}
nav.tabs a:active{transform:scale(.88)}
.say:active{transform:scale(.9)}
output.pop{display:inline-block;animation:pop .4s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.45)}100%{transform:scale(1)}}
.check.tik-yeni{animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
.check.tik-yeni svg path,.check.tik-yeni svg polyline{stroke-dasharray:30;animation:tikCiz .45s ease-out both}
@keyframes tikCiz{from{stroke-dashoffset:30}to{stroke-dashoffset:0}}
.moon{animation:suzul 7s ease-in-out infinite}
@keyframes suzul{50%{transform:translateY(-4px)}}
/* gösterge dış çizgileri: ibreyle yanar */
.gauge .tk{stroke:currentColor;stroke-opacity:.16;stroke-width:2.2;stroke-linecap:round;transition:stroke-opacity .12s}
.gauge .tk.on{stroke:var(--c);stroke-opacity:1}
/* sesli brifing: göndermeden önce geri sayım halkası */
@property --gs{syntax:"<angle>";inherits:false;initial-value:0deg}
.orb.sayiyor::after{content:"";position:absolute;inset:-16px;border-radius:50%;z-index:-1;background:conic-gradient(var(--mint) var(--gs),transparent 0);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 6px),#000 calc(100% - 5px));mask:radial-gradient(farthest-side,transparent calc(100% - 6px),#000 calc(100% - 5px));animation:geriSay 3s linear forwards}
@keyframes geriSay{to{--gs:360deg}}
.chip[aria-pressed="true"]{background:var(--mint-soft);color:var(--ink);border-color:var(--mint)}
/* renk seçici */
.renkler{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:6px}
.renk{display:grid;justify-items:center;gap:6px;background:none;border:0;color:var(--ink-2);font:700 12px var(--font-body);padding:6px 0;border-radius:14px}
.renk i{width:46px;height:46px;border-radius:50%;box-shadow:0 0 0 1px var(--line-2);transition:box-shadow .2s,transform .35s cubic-bezier(.3,1.6,.5,1)}
.renk.secili{color:var(--ink)}
.renk.secili i{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--mint);transform:scale(1.07)}
.ayar-b{margin:14px 0 8px;font-weight:700;color:var(--ink-2)}
.seg[hidden]{display:none}
::view-transition-old(root),::view-transition-new(root){animation-duration:.45s}

/* 2.8 program: günün akışı zaman çizgisinde */
.prg-bar{height:6px;border-radius:99px;background:var(--surface-3);overflow:hidden;margin:-4px 0 12px}
.prg-bar i{display:block;height:100%;border-radius:99px;background:var(--mint);transition:width .7s cubic-bezier(.2,.8,.2,1)}
ul.akis{list-style:none;margin:0;padding:0;--ray:67px}
ul.akis li{position:relative;display:flex;align-items:center;gap:10px;min-width:0}
ul.akis li::before{content:"";position:absolute;left:var(--ray);top:0;bottom:0;width:2px;background:var(--line);pointer-events:none}
ul.akis li:first-child::before{top:50%}
ul.akis li:last-child::before{bottom:50%}
ul.akis li:only-child::before{display:none}
.ak{padding:8px 0;min-height:46px}
.ak-saat{flex:none;width:44px;font-family:var(--font-display);font-variant-numeric:tabular-nums;font-weight:600;font-size:16px;color:var(--ink-2)}
.ak .check{position:relative;z-index:1;border-radius:50%;background:var(--surface);overflow:visible}
.ak .check .dalga{display:none}
.ak .check[aria-pressed="true"]{background:var(--mint)}
.ak .check::after{content:"";position:absolute;inset:-10px -8px}
.ak .x::after,.ak .bell::after{content:"";position:absolute;inset:-6px -5px}
.ak .x,.ak .bell{position:relative}
.ak-govde{flex:1;min-width:0;display:grid;gap:1px}
.ak-govde .li-text{flex:none}
.ak-alt{font-size:12px;font-weight:600;color:var(--ink-3);overflow-wrap:anywhere}
.ak-alt b{font-weight:800;color:var(--ink)}
.ak.done .ak-saat{color:var(--ink-3)}
.ak.gec .ak-saat,.ak.gec .ak-alt{color:var(--amber)}
.ak.sira{background:var(--mint-soft);border-radius:15px;margin:3px -8px;padding-left:8px;padding-right:4px}
.ak.sira::before{left:calc(var(--ray) + 8px)}
.ak.sira .ak-saat{color:var(--ink)}
.ak.yeni{animation:akYeni 1.5s ease-out}
@keyframes akYeni{0%,35%{background:var(--mint-soft);border-radius:15px}100%{background:transparent;border-radius:15px}}
.ak-nokta{flex:none;position:relative;z-index:1;width:28px;height:28px;display:grid;place-items:center}
.ak-nokta::after{content:"";width:11px;height:11px;border-radius:3px;transform:rotate(45deg);background:var(--sky);box-shadow:0 0 0 4px var(--surface)}
.ak.tur .li-text{font-weight:700;font-size:14px}
.ak.tur.gecmis .ak-saat,.ak.tur.gecmis .li-text{color:var(--ink-3)}
.ak.tur.gecmis .ak-nokta::after{background:var(--line-2)}
.ak.tur .pill{flex:none}
.ak-grup{padding:10px 0 2px}
.ak-grup:first-child{padding-top:0}
.ak-grup span{margin-left:calc(var(--ray) + 25px);font-size:12px;font-weight:800;color:var(--ink-3)}
.ak-simdi{padding:5px 0}
.ak-simdi .ak-saat{color:var(--coral);font-size:14px}
.ak-nabiz{flex:none;position:relative;z-index:1;width:28px;height:12px;display:grid;place-items:center}
.ak-nabiz::before,.ak-nabiz::after{content:"";grid-area:1/1;width:10px;height:10px;border-radius:50%;background:var(--coral)}
.ak-nabiz::before{box-shadow:0 0 0 3px var(--surface)}
.ak-nabiz::after{animation:akNabiz 2.2s ease-out infinite}
@keyframes akNabiz{from{transform:scale(1);opacity:.55}to{transform:scale(3);opacity:0}}
.ak-cizgi{flex:1;display:flex;align-items:center;gap:8px;color:var(--coral);font-size:12px;font-weight:800}
.ak-cizgi::after{content:"";flex:1;height:2px;border-radius:2px;background:var(--coral);opacity:.55}
html.sade .ak-nabiz::after{animation:none;opacity:0}
@media (prefers-reduced-motion:reduce){.ak-nabiz::after{animation:none;opacity:0}}
/* gök kartı: sıradaki iş iki satır, başlık kesilmesin; dokununca programdaki yerine iner */
.next.zamanli{display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:10px;row-gap:0;padding:8px 12px}
.next.zamanli .t{grid-row:1/3;align-self:center}
.next.zamanli .w,.next.zamanli .in{grid-column:2;line-height:1.25}
/* Vespa ufuk çizgisinde yerine sürer */
.vespa-git.gel{animation:vespaGel 2.6s cubic-bezier(.22,.8,.3,1) both}
@keyframes vespaGel{from{transform:translateX(-300px)}to{transform:translateX(0)}}
/* alışkanlık işaretlenince nokta zıplar; çubuklar sayfaya girerken dolar */
.habchip.pop .dot{animation:pop .4s cubic-bezier(.3,1.6,.5,1)}
#view.gir .bar i,#view.gir .karne-p i{transform-origin:left center;animation:barDol .8s cubic-bezier(.2,.8,.2,1) .2s both}
@keyframes barDol{from{transform:scaleX(0)}to{transform:scaleX(1)}}
/* alttan açılan sayfalar */
#sheet.acilis .sheet,#ses.acilis .sheet{animation:sayfaYuksel .36s cubic-bezier(.2,.9,.25,1) both}
#sheet.acilis .sheet-bg,#ses.acilis .sheet-bg{animation:sayfaSol .28s ease-out both}
@keyframes sayfaYuksel{from{transform:translate3d(0,100%,0)}to{transform:none}}
@keyframes sayfaSol{from{opacity:0}to{opacity:1}}
/* mesaj balonu: "Geri al" düğmesi */
.toast{animation-name:toastGir}
@keyframes toastGir{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
.toast-b{margin-left:10px;border:0;background:transparent;color:inherit;font:inherit;font-weight:800;text-decoration:underline;text-underline-offset:3px;padding:8px 4px;margin-top:-8px;margin-bottom:-8px}

:root[data-renk="tramonto"]{color-scheme:dark;
  --font-display:"Bricolage Grotesque","Saira Semi Condensed",system-ui,sans-serif;--font-body:"Instrument Sans",system-ui,-apple-system,sans-serif;
  --bg:#170f1e;--bg-2:#1e1428;--surface:#261a32;--surface-2:#31223f;--surface-3:#3e2c4f;--line:#3d2b4d;--line-2:#584069;
  --ink:#fdf2ea;--ink-2:#d2bfcc;--ink-3:#a08ca0;--mint:#ffae52;--on-mint:#3a1a02;--mint-soft:rgba(255,174,82,.16);
  --coral:#ff6f91;--coral-soft:rgba(255,111,145,.16);--amber:#ffd166;--amber-soft:rgba(255,209,102,.15);
  --sky:#8fb8ff;--rose:#ff8fc0;--violet:#c4a6ff;--mood-low:#ff8a5c;--mood-high:#8fb8ff;--good:#7be0a4;--bad:#ff7a7a;
  --shadow:0 14px 36px rgba(8,2,14,.5);--a1:rgba(255,138,76,.30);--a2:rgba(224,84,168,.24);--a3:rgba(126,104,255,.18);--parilti:rgba(255,220,200,.07)}
:root[data-renk="limon"]{color-scheme:light;
  --font-display:"Rubik","Saira Semi Condensed",system-ui,sans-serif;--font-body:"Nunito",system-ui,-apple-system,sans-serif;
  --bg:#fff4c7;--bg-2:#fffae6;--surface:#fffefa;--surface-2:#fff6d6;--surface-3:#ffeaa3;--line:#f3e2a0;--line-2:#e2c96a;
  --ink:#1a2145;--ink-2:#4a5179;--ink-3:#62678a;--mint:#2747f5;--on-mint:#ffffff;--mint-soft:rgba(39,71,245,.11);
  --coral:#d2331d;--coral-soft:rgba(210,51,29,.11);--amber:#955e00;--amber-soft:rgba(240,170,0,.18);
  --sky:#1787e0;--rose:#d93d86;--violet:#7445e8;--mood-low:#e8612a;--mood-high:#2a78e0;--good:#11915a;--bad:#d0362a;
  --shadow:0 12px 30px rgba(120,90,0,.14);--a1:rgba(255,196,40,.50);--a2:rgba(255,140,90,.26);--a3:rgba(255,255,255,.75);--parilti:rgba(255,255,255,.85)}
:root[data-renk="neon"]{color-scheme:dark;
  --font-display:"Chakra Petch","Saira Semi Condensed",system-ui,sans-serif;--font-body:"Lexend",system-ui,-apple-system,sans-serif;
  --bg:#07080f;--bg-2:#0c0e1a;--surface:#12152b;--surface-2:#1a1e3b;--surface-3:#252b50;--line:#272c52;--line-2:#3d4578;
  --ink:#f3f5ff;--ink-2:#b6bce4;--ink-3:#858cbb;--mint:#b08cff;--on-mint:#190a3d;--mint-soft:rgba(176,140,255,.17);
  --coral:#ff5fa0;--coral-soft:rgba(255,95,160,.16);--amber:#ffc857;--amber-soft:rgba(255,200,87,.15);
  --sky:#4fd8ff;--rose:#ff7ac8;--violet:#b08cff;--mood-low:#ff8a5c;--mood-high:#4fd8ff;--good:#5df0a8;--bad:#ff6b7d;
  --shadow:0 14px 38px rgba(0,0,0,.6);--a1:rgba(150,92,255,.34);--a2:rgba(255,70,160,.22);--a3:rgba(40,200,255,.20);--parilti:rgba(190,170,255,.08)}
:root[data-renk="limon"] body{font-size:15.5px}
:root[data-renk="neon"] h1,:root[data-renk="neon"] h2,:root[data-renk="neon"] .sky .hello{letter-spacing:.01em}
.renkler{grid-template-columns:repeat(4,1fr)}

/* 2.8 alışkanlık karoları */
.karolar{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:8px}
.habchip.karo{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:8px 8px;text-align:left;padding:11px 12px 10px;border-radius:16px;min-height:76px;color:var(--ink)}
.habchip.karo .kr-ad{display:flex;align-items:center;gap:7px;min-width:0;font-weight:800;font-size:14.5px}
.habchip.karo .kr-ad span{overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.15;overflow-wrap:anywhere}
.karolar>.karo:last-child:nth-child(odd){grid-column:1/-1}
.kr-em{flex:none;font-size:18px;line-height:1;font-style:normal}
.habchip.karo .dot{width:24px;height:24px;border-radius:50%;justify-self:end}
.habchip.karo .dot svg{width:14px;height:14px;stroke:var(--on-mint);stroke-width:3.2;fill:none;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.habchip.karo[aria-pressed="true"]{background:var(--mint-soft);border-color:var(--mint);color:var(--ink)}
.habchip.karo[aria-pressed="true"] .dot svg{opacity:1}
.kr-alt{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:0}
.kr-gun{display:flex;gap:3px;flex:none}
.kr-gun i{width:8px;height:8px;border-radius:50%;background:var(--surface-3);box-shadow:inset 0 0 0 1px var(--line-2)}
.kr-gun i.v{background:var(--mint);box-shadow:none}
.kr-gun i.b{outline:2px solid var(--ink-3);outline-offset:1px}
.kr-not{font-size:11.5px;font-weight:700;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.counter.karo{padding:11px 12px 10px;border-radius:16px;gap:8px;border:1px solid var(--line)}
.counter.karo .lbl{display:flex;align-items:center;gap:7px;font-size:13.5px;font-weight:800;color:var(--ink);overflow:visible}
.counter.karo .lbl span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.counter.karo .stepper button{width:40px;height:44px;border-radius:13px}
.counter.karo .stepper button[data-n="1"],.counter.karo .stepper button[data-n="0.5"]{width:50px;background:var(--mint);color:var(--on-mint);border-color:transparent;font-size:22px}
.counter.karo .stepper output{font-size:28px;line-height:1}
.kr-graf{display:flex;align-items:flex-end;gap:3px;height:22px;flex:none}
.kr-graf i{width:7px;border-radius:3px 3px 1px 1px;background:var(--line-2);min-height:3px}
.kr-graf i.b{background:var(--mint)}
.kr-graf i.b.cok{background:var(--coral)}
.counters>.karo:last-child:nth-child(odd){grid-column:1/-1;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;column-gap:12px}
.counters>.karo:last-child:nth-child(odd) .stepper{gap:10px}
.counters>.karo:last-child:nth-child(odd) .kr-alt{grid-column:1/-1}
#view.gir .kr-graf i{transform-origin:center bottom;animation:grafDol .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(.25s + var(--j,0) * 40ms)}
@keyframes grafDol{from{transform:scaleY(.1)}to{transform:scaleY(1)}}

/* 2.8 kompakt şerit + bölüm çipleri */
.serit{position:fixed;top:0;left:0;right:0;z-index:20;padding:calc(env(safe-area-inset-top) + 6px) max(12px, env(safe-area-inset-right)) 8px max(12px, env(safe-area-inset-left));
  background:color-mix(in srgb, var(--bg) 80%, transparent);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);border-bottom:1px solid var(--line);
  transform:translate3d(0,-104%,0);opacity:0;pointer-events:none;transition:transform .28s cubic-bezier(.2,.8,.2,1),opacity .2s}
.serit.acik{transform:none;opacity:1;pointer-events:auto}
html.sade .serit{background:var(--bg);-webkit-backdrop-filter:none;backdrop-filter:none}
.serit-ust{display:flex;align-items:center;gap:6px;max-width:560px;margin:0 auto}
.serit-ust .grow{flex:1}
.serit .iconbtn{width:40px;height:40px;border-radius:13px;flex:none}
.serit-ad{border:0;background:transparent;color:var(--ink);font-family:var(--font-display);font-weight:700;font-size:18px;padding:8px 6px;min-height:40px;white-space:nowrap}
.serit-cip{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:8px -12px 0;padding:0 12px 1px;max-width:584px;-webkit-overflow-scrolling:touch}
.serit-cip::-webkit-scrollbar{display:none}
.serit-cip .chip{flex:none;padding:8px 13px;min-height:36px}
/* 2.8 kapanır kartlar */
.kapa-h{margin:0;min-width:0;flex:1}
.card-h>.kapa-h{flex:0 1 auto}
.kapa{display:flex;align-items:center;gap:8px;width:100%;border:0;background:transparent;color:inherit;font:inherit;letter-spacing:inherit;padding:6px 0;margin:-6px 0;text-align:left;min-height:36px;overflow:visible}
.kapa .dalga{display:none}
.kapa-ok{flex:none;width:18px;height:18px;fill:none;stroke:var(--ink-3);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;transition:transform .25s}
.kapa[aria-expanded="false"] .kapa-ok{transform:rotate(-90deg)}
.card.kapali{padding-top:10px;padding-bottom:10px}
.card.kapali .kapa{min-height:44px}
.kapa-ad{flex:none}
.kapa-ozet{flex:1;min-width:0;text-align:right;font-family:var(--font-body);font-size:13px;font-weight:600;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card.acildi{animation:kartAc .34s cubic-bezier(.2,.8,.2,1)}
@keyframes kartAc{from{opacity:.4;transform:translate3d(0,-8px,0)}to{opacity:1;transform:none}}
/* çekerek kapatma */
.sheet .grab,.sheet .card-h{touch-action:none}
.sheet .grab{position:relative}
.sheet .grab::before{content:"";position:absolute;inset:-12px -60px}

/* 2.8.1 sohbet modu: konu şeridi */
.sohbet-yol{list-style:none;display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin:10px 0 2px;padding:0}
.sohbet-yol li{padding:5px 11px;border-radius:99px;font-size:12.5px;font-weight:700;color:var(--ink-3);background:var(--surface-2);border:1px solid var(--line)}
.sohbet-yol li.gecti{color:var(--ink-2);text-decoration:line-through;text-decoration-color:var(--line-2)}
.sohbet-yol li.simdi{color:var(--on-mint);background:var(--mint);border-color:transparent}

.adimlar{margin:0 0 10px;padding-left:18px;color:var(--ink-2);display:grid;gap:4px}

/* ==== DETAY SAYFALARI ==== */
#detay{position:fixed;inset:0;z-index:35;--ar:var(--mint)}
#detay[hidden]{display:none}
#detay.hrksiz *,#detay.hrksiz *::before,#detay.hrksiz *::after{animation:none!important;transition:none!important}
.dt-yuzey{position:absolute;inset:0;background:var(--bg);transform-origin:0 0;overflow:hidden}
.dt-yuzey::before{content:"";position:absolute;inset:0;background:radial-gradient(130% 52% at 50% -8%,color-mix(in oklab,var(--ar) 36%,transparent),transparent 72%),radial-gradient(70% 30% at 100% 100%,color-mix(in oklab,var(--ar) 12%,transparent),transparent 70%)}
.dt-ic{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:calc(env(safe-area-inset-top) + 10px) max(16px,env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 36px) max(16px,env(safe-area-inset-left))}
.dt-ic>*{max-width:560px;margin-left:auto;margin-right:auto}
.dt-ic>*+*{margin-top:12px}
.dt-ust{display:flex;align-items:center;gap:12px}
.dt-ust .iconbtn{flex:none;width:44px;height:44px;background:var(--cam)}
.dt-ust .iconbtn svg{width:22px;height:22px;stroke-width:2.4}
.dt-ust h1{display:flex;align-items:center;gap:9px;font-size:24px;margin:0;min-width:0}
.dt-ust h1 i{font-style:normal;font-size:22px;flex:none}
.dt-ust h1 span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dt-hero{position:relative;display:flex;align-items:center;gap:18px;padding:16px 4px 4px}
.dt-hero-s{min-width:0;flex:1}
.dt-gun{font-size:13.5px;font-weight:800;color:color-mix(in oklab,var(--ar) 72%,var(--ink))}
.dt-sayi-s{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.dt-sayi{display:inline-block;font-family:var(--font-display);font-size:68px;font-weight:700;line-height:.98;letter-spacing:-.02em;transform-origin:0 100%}
.dt-sayi.uzun{font-size:52px}
.dt-sayi.bos{font-size:40px;color:var(--ink-3)}
.dt-sayi.zipla{animation:dtZipla .42s cubic-bezier(.3,1.7,.5,1)}
@keyframes dtZipla{0%{transform:scale(1)}35%{transform:scale(1.14)}100%{transform:scale(1)}}
.dt-birim{font-size:17px;font-weight:800;color:var(--ink-2)}
.dt-alt{margin:6px 0 0;font-size:13.5px;line-height:1.4;color:var(--ink-2)}
.dt-alt b{color:var(--ink)}
.dt-rozet{flex:none;align-self:flex-start;background:color-mix(in oklab,var(--ar) 20%,transparent);color:var(--ink);border-radius:999px;padding:6px 11px;font-size:12.5px;font-weight:800;white-space:nowrap}
.dt-kontrol{display:grid;gap:8px}
.dt-step{gap:10px}
.dt-step button{flex:none;width:64px;height:54px;border-radius:17px;font-size:24px;background:var(--cam)}
.dt-step button.arti{flex:1;width:auto;background:var(--ar);color:#08131d;border-color:transparent;font-size:16px;font-weight:800}
.dt-satir{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--cam);border:1px solid var(--line);border-radius:16px;padding:10px 12px;font-weight:800}
.dt-satir>span:first-child{display:flex;align-items:center;gap:8px;min-width:0}
.dt-satir .stepper{gap:10px;flex:none}
.dt-satir .stepper button{width:46px;height:44px}
.dt-satir .stepper button[data-n="1"]{background:var(--ar);color:#08131d;border-color:transparent}
.dt-satir output{min-width:34px}
.dt-isaret{height:54px;border-radius:17px;background:var(--ar);color:#08131d;font-size:16px}
.dt-isaret[aria-pressed="true"]{background:color-mix(in oklab,var(--ar) 20%,transparent);color:var(--ink);box-shadow:inset 0 0 0 2px var(--ar)}
.dt-seg{background:var(--cam)}
.dt-seg button[aria-pressed="true"]{background:var(--ar);color:#08131d}
.dt-grafik{padding-top:18px}
.dt-grafik.canli{animation:dgGel .3s ease-out}
@keyframes dgGel{from{opacity:0;transform:translateY(8px)}}
.dg-bars{position:relative;display:flex;align-items:flex-end;gap:6px;height:150px;padding-bottom:20px}
.dg-bars.sik{gap:2px}
.dg-bars.saat,.dg-bars.hg{height:112px}
.dg-b{position:relative;flex:1;min-width:0;height:100%;border:0;background:transparent;padding:0;display:flex;align-items:flex-end;justify-content:center;color:inherit}
.dg-b i{display:block;width:100%;max-width:36px;height:100%;overflow:hidden;border-radius:0 0 3px 3px}
.dg-b i::before{content:"";display:block;height:100%;border-radius:8px 8px 0 0;background:color-mix(in oklab,var(--ar) 34%,var(--surface-3));transform:translateY(calc((1 - var(--h)) * 100%));animation:dgBar .5s cubic-bezier(.22,1.1,.36,1) backwards;animation-delay:calc(var(--j) * 32ms + 90ms)}
.dg-bars.sik .dg-b i::before{border-radius:4px 4px 0 0}
@keyframes dgBar{from{transform:translateY(100%)}}
.dg-b.iyi i::before{background:color-mix(in oklab,var(--ar) 62%,var(--surface-3))}
.dg-b.sec i::before{background:var(--ar)}
.dg-b.bos i{height:4px;border-radius:2px;background:var(--line-2)}
.dg-b.bos i::before{display:none}
.dg-b>span{position:absolute;bottom:-19px;left:50%;transform:translateX(-50%);font-size:10.5px;font-weight:700;color:var(--ink-3);white-space:nowrap}
.dg-b.sec>span{color:var(--ink)}
.dg-hedef{position:absolute;left:0;right:0;bottom:calc(20px + (100% - 20px) * var(--y));border-top:1.5px dashed color-mix(in oklab,var(--ink) 42%,transparent);pointer-events:none;z-index:1}
.dg-hedef em{position:absolute;left:0;top:-17px;font-size:10.5px;font-style:normal;font-weight:800;color:var(--ink-2)}
.dg-alt{margin:10px 0 0;text-align:center;font-weight:700}
.dg-bos{margin:0;padding:22px 0;text-align:center}
.dg-ac{overflow:hidden;animation:dgAcL .8s cubic-bezier(.3,.1,.2,1) .1s backwards}
.dg-ac-ic{animation:dgAcR .8s cubic-bezier(.3,.1,.2,1) .1s backwards}
@keyframes dgAcL{from{transform:translateX(-100%)}}
@keyframes dgAcR{from{transform:translateX(100%)}}
.dg-cizgi{display:block;width:100%;height:auto}
.dg-lejant{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;font-size:12px;font-weight:700;color:var(--ink-2)}
.dg-lejant i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.dg-halka{display:grid;grid-template-columns:124px minmax(0,1fr);gap:14px;align-items:center}
.dg-halka svg{width:124px;height:124px;animation:dgHalka .6s cubic-bezier(.22,1.1,.36,1) .1s backwards}
@keyframes dgHalka{from{transform:rotate(-70deg) scale(.82);opacity:0}}
.hk-b{font:700 17px var(--font-display);fill:var(--ink)}
.hk-k{font:700 10px var(--font-body);fill:var(--ink-3)}
.dg-liste{list-style:none;margin:0;padding:0;display:grid;gap:7px;font-size:13px}
.dg-liste li{display:grid;grid-template-columns:10px minmax(0,1fr) auto 36px;gap:8px;align-items:center}
.dg-liste i{width:10px;height:10px;border-radius:3px}
.dg-liste span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.dg-liste em{font-style:normal;color:var(--ink-3);text-align:right;font-size:12px}
.dt-yer{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.dt-yer li{position:relative;display:flex;justify-content:space-between;gap:10px;font-weight:700;font-size:14px;padding-bottom:9px}
.dt-yer li span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dt-yer li i{position:absolute;left:0;right:0;bottom:0;height:5px;border-radius:3px;background:var(--ar);transform:scaleX(var(--w));transform-origin:0 50%;animation:dgYer .5s cubic-bezier(.22,1,.36,1) backwards;animation-delay:calc(var(--j) * 60ms + 120ms)}
@keyframes dgYer{from{transform:scaleX(0)}}
.dt-tx{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.dt-tx li{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:10px;align-items:center}
.dt-tx i{width:10px;height:10px;border-radius:50%}
.dt-tx span{font-weight:700;font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dt-tx small{display:block;font-weight:600;font-size:11.5px;color:var(--ink-3)}
.dt-tx b{font-family:var(--font-display);font-size:17px}
.dt-tx b.in{color:var(--mint)}
.dt-yazi{margin:0;font-size:14.5px;line-height:1.55;color:var(--ink-2)}
.dt-yazi b{color:var(--ink)}
.dt-koc{background:linear-gradient(135deg,color-mix(in oklab,var(--ar) 18%,var(--cam)),var(--cam));border-color:color-mix(in oklab,var(--ar) 38%,var(--line))}
.dt-koc .dt-yazi{color:var(--ink);font-size:15px}
.dt-hedef-s{display:flex;align-items:center;gap:14px}
.dt-hedef-s .stepper{gap:10px;flex:none}
.dt-hedef-s .stepper button{width:44px;height:44px}

<script>
"use strict";
/* Hayat Paneli 2.0 — personal panel. Data lives in the owner's Google Drive behind his Apps Script;
   this file only talks to that script (ops: yukle, kaydet, gelen, gelenIptal, turlar, randevu). */
const SURUM = "2.9.0";

/* ---------- constants ---------- */
const TZ = "Europe/Rome";
const GUN = ["Pazar","Pazartesi","Salı","Çarşamba","Perşembe","Cuma","Cumartesi"];
const GUN_K = ["Paz","Pzt","Sal","Çar","Per","Cum","Cmt"];

const AY_K = ["Oca","Şub","Mar","Nis","May","Haz","Tem","Ağu","Eyl","Eki","Kas","Ara"];
const DEFAULT_HABITS = [
  {key:"spor", label:"Spor", type:"check"},
  {key:"okuma", label:"Okuma", type:"check"},
  {key:"sigara", label:"Sigara", type:"count", lower:true},
  {key:"su", label:"Su (bardak)", type:"count"},
  {key:"cis", label:"Çiş", type:"count"},
  {key:"buyuk", label:"Büyük tuvalet", type:"count"}
];
/* things worth tracking, offered with one tap (answer to "which personal data is useful?") */
const ONERILEN = [
  {key:"dis", label:"Diş fırçalama", type:"check", neden:"Akşam rutini; gece brifinginde sorulur, “dişimi fırçaladım” demen yeter."},
  {key:"kahve", label:"Kahve", type:"count", neden:"Kafein uykunu ve sigara isteğini etkiler; uykuyla yan yana bakınca anlam kazanır."},
  {key:"alkol", label:"Alkol (kadeh)", type:"count", lower:true, neden:"Ertesi günün enerjisi ve uykusuyla ilişkisini görürsün."},
  {key:"ekran", label:"Ekran süresi (saat)", type:"count", lower:true, neden:"iPhone Ekran Süresi'nden akşam gir; odakla bağlantısı netleşir."},
  {key:"yuruyus", label:"10 bin adım", type:"check", neden:"Tur günleri zaten yürüyorsun; tursuz günler için hedef."},
  {key:"nefes", label:"Nefes / meditasyon", type:"check", neden:"5 dakika bile sigara isteğini ve gerginliği düşürür."},
  {key:"saglikli", label:"Sağlıklı öğün", type:"check", neden:"Spor hedefinle birlikte gider; enerjiye etkisini görürsün."},
  {key:"sosyal", label:"Sevdiklerinle vakit", type:"check", neden:"Ruh halini en çok etkileyen şeylerden biri."},
  {key:"kilo", label:"Kilo (kg)", type:"olcum", neden:"Haftada 1-2 kez, sabah aç karnına tart."}

const MOODS = [["energy","Enerji","var(--sky)"],["mood","Ruh hali","var(--rose)"],["focus","Odak","var(--mint)"]];

/* money categories (colors are mid-tones that read on both themes) */
const KAT_GIDER = [
  {k:"yemek", l:"Yemek", c:"#f2875f", w:["yemek","yemeğe","yemeği","restoran","restorana","pizza","kebap","döner","burger","sushi","öğle yemeği","akşam yemeği","kahvaltı","lokanta","trattoria","pranzo","cena","yedik","yedim"]},
  {k:"market", l:"Market", c:"#e3b341", w:["market","markete","süpermarket","eurospin","conad","lidl","carrefour","esselunga","bakkal","coop","pam"]},
  {k:"kahve", l:"Kahve & bar", c:"#c08f5f", w:["kahve","kahveye","cafe","kafe","bar","bara","bira","içki","aperitivo","espresso","cappuccino","şarap","spritz"]},
  {k:"sigara", l:"Sigara", c:"#97a1ad", w:["sigara","sigaraya","tütün","paket"]},
