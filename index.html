<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hayat</title>
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hayat">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0c1118">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="ikon-180.png">
<link rel="icon" type="image/png" href="ikon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Saira+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<script>try{var t=localStorage.getItem("hayat.tema");t=t&&JSON.parse(t);if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<style>
/* Layout: one phone-width column. Scrolling middle, tab bar pinned at the bottom with a centre "Söyle" button.
   Look: Roman night (blue-black) with Vespa mint as the accent and ponentino coral for things that need you.
   The one loud element is the sky card on Bugün; everything else stays quiet. */
:root{
  color-scheme: dark;
  --bg:#0c1118; --bg-2:#0f1620; --surface:#141c27; --surface-2:#1b2533; --surface-3:#222e3f;
  --line:#243042; --line-2:#33425a;
  --ink:#edf1f5; --ink-2:#a9b4c3; --ink-3:#717e90;
  --mint:#7bdcb8; --on-mint:#05261a; --mint-soft:rgba(123,220,184,.14);
  --coral:#ff8d6b; --coral-soft:rgba(255,141,107,.14);
  --amber:#f5b94a; --amber-soft:rgba(245,185,74,.14);
  --sky:#74b4ff; --rose:#f48fb1; --violet:#b39dff;
  --good:#5bd48f; --bad:#ff6f6f;
  --shadow:0 12px 32px rgba(0,0,0,.38);
  --font-display:"Saira Semi Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
  --font-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:20px; --r-sm:13px;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    color-scheme: light;
    --bg:#edf0f4; --bg-2:#f7f8fa; --surface:#ffffff; --surface-2:#f2f4f7; --surface-3:#e8ecf1;
    --line:#dfe4eb; --line-2:#cbd3de;
    --ink:#111923; --ink-2:#465366; --ink-3:#77849a;
    --mint:#0c9a72; --on-mint:#ffffff; --mint-soft:rgba(12,154,114,.12);
    --coral:#dd5530; --coral-soft:rgba(221,85,48,.11);
    --amber:#b07214; --amber-soft:rgba(176,114,20,.12);
    --sky:#2c78d6; --rose:#cc4479; --violet:#6f55dc;
    --good:#12924c; --bad:#d23a3a;
    --shadow:0 10px 26px rgba(20,32,52,.10);
  }
}
:root[data-theme="light"]{
  color-scheme: light;
  --bg:#edf0f4; --bg-2:#f7f8fa; --surface:#ffffff; --surface-2:#f2f4f7; --surface-3:#e8ecf1;
  --line:#dfe4eb; --line-2:#cbd3de;
  --ink:#111923; --ink-2:#465366; --ink-3:#77849a;
  --mint:#0c9a72; --on-mint:#ffffff; --mint-soft:rgba(12,154,114,.12);
  --coral:#dd5530; --coral-soft:rgba(221,85,48,.11);
  --amber:#b07214; --amber-soft:rgba(176,114,20,.12);
  --sky:#2c78d6; --rose:#cc4479; --violet:#6f55dc;
  --good:#12924c; --bad:#d23a3a;
  --shadow:0 10px 26px rgba(20,32,52,.10);
}

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;overflow:hidden;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--mint);outline-offset:2px;border-radius:8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-3)}
.small{font-size:12.5px}

#main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(env(safe-area-inset-top) + 12px) max(16px, env(safe-area-inset-right)) 28px max(16px, env(safe-area-inset-left))}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}

/* ---------- tab bar ---------- */
nav.tabs{flex:none;position:relative;display:grid;grid-template-columns:repeat(5,1fr);align-items:end;background:var(--bg-2);border-top:1px solid var(--line);padding:6px max(6px, env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 6px) max(6px, env(safe-area-inset-left))}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0 4px;color:var(--ink-3);text-decoration:none;font-size:11px;font-weight:700;letter-spacing:.01em;border-radius:12px}
nav.tabs a svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs a[aria-current="page"]{color:var(--ink)}
nav.tabs a[aria-current="page"] svg{stroke:var(--mint)}
.say{justify-self:center;width:58px;height:58px;margin-top:-26px;border-radius:50%;border:0;background:var(--mint);color:var(--on-mint);display:grid;place-items:center;box-shadow:0 8px 22px rgba(0,0,0,.35),0 0 0 5px var(--bg-2)}
.say svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.say:active{transform:scale(.96)}

/* ---------- headers ---------- */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:4px 2px 2px}
.eyebrow{font-size:11.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--mint)}
h1{font-family:var(--font-display);font-weight:700;font-size:30px;line-height:1.02;margin:3px 0 0;letter-spacing:-.005em;text-wrap:balance}
h2{font-family:var(--font-display);font-weight:600;font-size:19px;line-height:1.15;margin:0;letter-spacing:.005em}
.btnrow{display:flex;gap:8px;flex:none;align-items:center}
.iconbtn{position:relative;width:42px;height:42px;border-radius:14px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink-2);padding:0}
.iconbtn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.badge{position:absolute;top:-5px;right:-5px;min-width:19px;height:19px;padding:0 5px;border-radius:99px;background:var(--coral);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;border:2px solid var(--bg)}

/* ---------- cards ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px}
.card-h .meta{font-size:12.5px;font-weight:600;color:var(--ink-3);white-space:nowrap}
.card.flat{background:transparent;border-style:dashed}
.sub{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin:14px 0 6px}
.sub:first-child{margin-top:0}
.empty{color:var(--ink-3);font-size:13.5px;padding:4px 0;margin:0}
.chiprow{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:700;color:var(--ink-2);white-space:nowrap}
.chip.on{background:var(--mint);color:var(--on-mint);border-color:var(--mint)}
.chip.warn{background:var(--amber-soft);border-color:transparent;color:var(--amber)}
.chip.hot{background:var(--coral-soft);border-color:transparent;color:var(--coral)}
.chip.wrap{white-space:normal;border-radius:12px;line-height:1.35}
.chip.ok{background:var(--mint-soft);border-color:transparent;color:var(--mint)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px}
.seg button{border:0;background:transparent;border-radius:10px;padding:8px 6px;font-size:13px;font-weight:700;color:var(--ink-3)}
.seg button[aria-pressed="true"]{background:var(--surface-3);color:var(--ink)}

.banner{border-radius:14px;padding:11px 13px;font-size:13px;background:var(--amber-soft);color:var(--ink);border:1px solid var(--line)}
.banner.info{background:var(--mint-soft)}

/* ---------- sky hero (Bugün) ---------- */
.sky{position:relative;overflow:hidden;border-radius:26px;padding:18px 18px 0;color:#14202e;isolation:isolate;box-shadow:var(--shadow)}
.sky.dawn{background:linear-gradient(165deg,#ffb48d 0%,#f9d7c3 38%,#a9cdf0 100%)}
.sky.day{background:linear-gradient(165deg,#5aa9f5 0%,#9fd0fb 55%,#e2f2ff 100%)}
.sky.dusk{background:linear-gradient(165deg,#ff9469 0%,#c4609a 52%,#46398a 100%);color:#fff}
.sky.night{background:linear-gradient(165deg,#1d2a5a 0%,#111a3c 55%,#0a0f24 100%);color:#fff}
.sky.night::before{content:"";position:absolute;inset:0;z-index:-1;opacity:.85;background-image:radial-gradient(1.4px 1.4px at 12% 18%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 28% 36%,#fff 50%,transparent 51%),radial-gradient(1.2px 1.2px at 46% 12%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 63% 28%,#fff 50%,transparent 51%),radial-gradient(1.6px 1.6px at 78% 10%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 90% 34%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 55% 44%,#fff 50%,transparent 51%),radial-gradient(1.2px 1.2px at 8% 46%,#fff 50%,transparent 51%)}
.sky.night .moon,.sky.dusk .moon{display:block}
.moon{display:none;position:absolute;right:76px;top:22px;width:22px;height:22px;border-radius:50%;box-shadow:-6px 4px 0 0 #fff4d6;z-index:-1;opacity:.9}
.sky-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.sky .hello{font-family:var(--font-display);font-weight:700;font-size:33px;line-height:1;letter-spacing:-.01em}
.sky .date{display:flex;align-items:center;gap:2px;font-size:13.5px;font-weight:700;margin-top:6px;margin-left:-8px}
.sky .date span{opacity:.8;padding:0 2px}
.daynav{width:30px;height:30px;border:0;border-radius:10px;background:transparent;color:inherit;display:grid;place-items:center;padding:0;opacity:.8}
.daynav svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.sky .iconbtn{background:rgba(255,255,255,.28);border-color:rgba(255,255,255,.35);color:inherit;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.sky .badge{border-color:transparent}
.sky-mid{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;margin-top:12px}
.gauge text{font-family:var(--font-display)}
.sky-stats{display:grid;gap:7px;min-width:0}
.sstat{display:flex;justify-content:space-between;align-items:baseline;gap:8px;border-bottom:1px solid rgba(255,255,255,.28);padding-bottom:6px;min-width:0}
.sky.dawn .sstat,.sky.day .sstat{border-bottom-color:rgba(20,32,46,.14)}
.sstat:last-child{border-bottom:0;padding-bottom:0}
.sstat span{font-size:12.5px;font-weight:700;opacity:.75;white-space:nowrap}
.sstat b{font-family:var(--font-display);font-size:18px;font-weight:700;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.next{text-decoration:none;display:flex;align-items:center;gap:10px;margin:14px 0 0;padding:10px 12px;border-radius:15px;background:rgba(255,255,255,.34);font-size:14px;font-weight:700;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:0;color:inherit;width:100%;text-align:left}
.sky.dusk .next,.sky.night .next{background:rgba(255,255,255,.14)}
.next .t{font-family:var(--font-display);font-size:17px;flex:none}
.next .w{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.next .in{flex:none;font-size:12px;opacity:.75}
.skyline{display:block;width:calc(100% + 36px);margin:10px -18px 0;height:58px;color:rgba(14,22,40,.30)}
.sky.dusk .skyline{color:rgba(30,18,60,.55)}
.sky.night .skyline{color:rgba(3,6,18,.75)}

/* ---------- lists / plan timeline ---------- */
ul.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
ul.list li{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);min-width:0}
ul.list li:last-child{border-bottom:0}
.check{width:28px;height:28px;border-radius:9px;border:2px solid var(--line-2);background:transparent;display:grid;place-items:center;flex:none;padding:0;transition:background .15s,border-color .15s}
.check svg{width:16px;height:16px;stroke:var(--on-mint);stroke-width:3;fill:none;opacity:0;stroke-linecap:round;stroke-linejoin:round}
.check[aria-pressed="true"]{background:var(--mint);border-color:var(--mint)}
.check[aria-pressed="true"] svg{opacity:1}
.li-time{font-family:var(--font-display);font-variant-numeric:tabular-nums;font-weight:600;color:var(--ink-2);font-size:16px;min-width:44px}
.li-time.late{color:var(--amber)}
.li-text{flex:1;min-width:0;overflow-wrap:anywhere}
li.done .li-text{color:var(--ink-3);text-decoration:line-through;text-decoration-color:var(--line-2)}
li.done .li-time{color:var(--ink-3)}
.x{border:0;background:transparent;color:var(--ink-3);width:32px;height:32px;border-radius:9px;flex:none;font-size:19px;line-height:1;padding:0}
.bell{border:0;background:transparent;color:var(--ink-3);width:32px;height:32px;border-radius:9px;flex:none;display:grid;place-items:center;padding:0}
.bell svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.bell.on{color:var(--mint)}
.bell.on svg{fill:var(--mint-soft)}
.nowline{display:flex;align-items:center;gap:8px;color:var(--coral);font-size:11.5px;font-weight:800;letter-spacing:.06em;padding:4px 0}
.nowline::after{content:"";flex:1;height:2px;border-radius:2px;background:var(--coral);opacity:.6}

form.add{display:flex;gap:8px;margin-top:12px}
.field{background:var(--surface-2);border:1px solid var(--line);border-radius:13px;padding:11px 12px;min-width:0;color:var(--ink);font-size:16px}
.field::placeholder{color:var(--ink-3)}
form.add .grow{flex:1}
input[type=time].field{width:100px;flex:none;padding:10px 8px}
input[type=date].field{min-width:0}
.btn{background:var(--mint);color:var(--on-mint);border:0;border-radius:13px;padding:11px 15px;font-weight:800;flex:none}
.btn.ghost{background:transparent;color:var(--ink-2);border:1px solid var(--line)}
.btn.soft{background:var(--surface-3);color:var(--ink)}
.btn:disabled{opacity:.5}
.btn.wide{width:100%}
textarea.field{width:100%;resize:vertical;min-height:76px;line-height:1.45}
.minibtn{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;min-width:38px;height:34px;font-weight:700;font-size:13px;padding:0 10px;color:var(--ink)}
.minibtn.danger{color:var(--bad)}
a.minibtn{display:inline-flex;align-items:center;text-decoration:none}
.linkbtn{text-decoration:none;border:0;background:transparent;color:var(--mint);font-weight:800;font-size:13.5px;padding:6px 0}

/* ---------- tours (short) ---------- */
.tline{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.tline b{font-family:var(--font-display);font-size:22px;font-weight:700}
.tline span{color:var(--ink-2);font-weight:600}
.tours{margin-top:10px;border-top:1px solid var(--line)}
.tour{display:grid;grid-template-columns:46px 1fr auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.tour:last-child{border-bottom:0}
.tour .t{font-family:var(--font-display);font-variant-numeric:tabular-nums;font-weight:600;font-size:16px}
.tour .n{font-weight:700;overflow-wrap:anywhere;font-size:14px}
.tour .d{font-size:12.5px;color:var(--ink-3)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:800;border-radius:999px;padding:3px 9px;white-space:nowrap}
.pill.ok{background:var(--mint-soft);color:var(--mint)}
.pill.wait{background:var(--amber-soft);color:var(--amber)}
.pill.hot{background:var(--coral-soft);color:var(--coral)}

/* ---------- posta / claude ---------- */
.mail{display:grid;grid-template-columns:12px 1fr;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);align-items:start}
.mail:last-child{border-bottom:0}
.mail i{width:10px;height:10px;border-radius:50%;margin-top:6px;background:var(--ink-3)}
.mail.r i{background:var(--coral);box-shadow:0 0 0 4px var(--coral-soft)}
.mail.o i{background:var(--amber)}
.mail.b i{background:var(--sky)}
.mail.w i{background:var(--line-2)}
.mail .mt{min-width:0;overflow-wrap:anywhere;font-size:14px}
.mail.w .mt{color:var(--ink-3);font-size:13px}
a.lnk{color:var(--mint);font-weight:800;text-decoration:none;white-space:nowrap}
.md p{margin:0 0 7px}.md p:last-child{margin:0}
.md ul{margin:4px 0 7px;padding-left:18px}
.md .mh{font-weight:800}
.brief{position:relative}
.brief .md{max-height:7.5em;overflow:hidden;-webkit-mask-image:linear-gradient(#000 60%,transparent);mask-image:linear-gradient(#000 60%,transparent)}
.brief.open .md{max-height:none;-webkit-mask-image:none;mask-image:none}
.who{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-bottom:8px}
.who .dot{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;background:var(--mint-soft);color:var(--mint)}
.who .dot svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

.feed{display:flex;flex-direction:column;gap:10px}
.fitem{display:grid;grid-template-columns:36px 1fr;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px}
.fitem.unread{border-color:var(--line-2);box-shadow:inset 3px 0 0 var(--coral)}
.ficon{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:var(--surface-3);color:var(--ink-2)}
.ficon svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ficon.posta{background:var(--coral-soft);color:var(--coral)}
.ficon.brifing{background:var(--mint-soft);color:var(--mint)}
.ficon.uyari{background:var(--amber-soft);color:var(--amber)}
.ficon.claude{background:rgba(116,180,255,.14);color:var(--sky)}
.fbody{min-width:0}
.fhead{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.fhead b{font-size:14px}
.fhead span{font-size:11.5px;color:var(--ink-3);white-space:nowrap}
.fbody .md{font-size:14px;color:var(--ink-2);margin-top:3px}

.msgs{display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;border-radius:18px;padding:10px 13px;font-size:14.5px;overflow-wrap:anywhere}
.msg.u{align-self:flex-end;background:var(--mint);color:var(--on-mint);border-bottom-right-radius:6px;white-space:pre-wrap}
.msg.a{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:6px}
.msg .when{display:block;font-size:11px;opacity:.65;margin-top:4px;text-align:right}
.msg.a .who2{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin:0 0 4px}
.msg.a.pending{border-style:dashed;color:var(--ink-2)}
.acts{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}

/* ---------- habits ---------- */
.habchecks{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.habchip{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface-2);border-radius:13px;padding:9px 13px;font-weight:700;font-size:14px}
.habchip .dot{width:17px;height:17px;border-radius:6px;border:2px solid var(--line-2);display:grid;place-items:center}
.habchip[aria-pressed="true"]{border-color:transparent;background:var(--mint-soft);color:var(--mint)}
.habchip[aria-pressed="true"] .dot{background:var(--mint);border-color:var(--mint)}
.counters{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.counter{background:var(--surface-2);border-radius:14px;padding:9px 10px 10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.counter .lbl{font-size:12.5px;font-weight:700;color:var(--ink-2);line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stepper{display:flex;align-items:center;justify-content:space-between;gap:4px}

/* ---------- week & habit grid ---------- */

.ring text{font-family:var(--font-display);font-weight:700;fill:var(--ink)}

.legend i{width:12px;height:3px;border-radius:2px;display:inline-block}

/* ---------- composer sheet ---------- */
.sheet-bg{position:fixed;inset:0;z-index:40;background:rgba(4,8,14,.55);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--surface);border-top:1px solid var(--line);border-radius:24px 24px 0 0;padding:10px max(16px, env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 14px) max(16px, env(safe-area-inset-left));box-shadow:0 -12px 40px rgba(0,0,0,.35);max-height:88vh;overflow:auto}
.sheet-in{max-width:560px;margin:0 auto;display:grid;gap:12px}
.grab{width:42px;height:5px;border-radius:9px;background:var(--line-2);margin:2px auto 4px}

.comprow textarea{flex:1;min-height:52px;max-height:150px;resize:none;font-size:16px}

.reply{background:var(--surface-2);border-radius:15px;padding:12px 13px;font-size:14.5px}

/* ---------- misc ---------- */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 92px);z-index:50;background:var(--ink);color:var(--bg);font-weight:700;font-size:14px;padding:10px 16px;border-radius:14px;box-shadow:var(--shadow);max-width:min(92vw,480px);text-align:center;animation:pop .25s ease-out}
@keyframes pop{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
.tip{position:fixed;z-index:30;pointer-events:none;background:var(--surface-3);border:1px solid var(--line-2);border-radius:10px;padding:8px 10px;font-size:12.5px;box-shadow:var(--shadow);max-width:220px}
.tip b{display:block;margin-bottom:2px}
.giris{position:fixed;inset:0;z-index:60;background:var(--bg);overflow:auto;padding:calc(env(safe-area-inset-top) + 32px) 20px 32px}
.giris[hidden]{display:none}
.giris-kart{max-width:480px;margin:0 auto;display:grid;gap:12px}
.giris-kart textarea{width:100%;font-size:15px;word-break:break-all}
.calchk{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2);margin-top:10px}
.calchk input{width:18px;height:18px;accent-color:var(--mint)}
.sp{height:4px}

</style>

<script>
"use strict";
/* Hayat Paneli 2.0 — personal panel. Data lives in the owner's Google Drive behind his Apps Script;
   this file only talks to that script (ops: yukle, kaydet, gelen, gelenIptal, turlar, randevu). */
const SURUM = "2.0.0";

/* ---------- constants ---------- */

const KAT_GIDER = [

const katBul = (k, tip) => (tip === "gelir" ? KAT_GELIR : KAT_GIDER).find(x => x.k === k) || (tip === "gelir" ? KAT_GELIR[3] : KAT_GIDER[11]);

/* standing requests the scheduled Claude tasks answer (see README in the Drive folder) */
const KANALLAR = [
  {kod:"posta", onek:"📬 POSTA", metin:"📬 POSTA ÖZETİ (uygulamanın otomatik isteği)"},
  {kod:"brifing", onek:"📣 BRİFİNG", metin:"📣 BRİFİNG (uygulamanın otomatik isteği)"}

const fmtLong = s => { const d = d2u(s); return `${GUN[d.getUTCDay()]}, ${d.getUTCDate()} ${AY[d.getUTCMonth()]}`; };

const monthDays = ym => { const [y,m] = ym.split("-").map(Number); const n = new Date(Date.UTC(y,m,0)).getUTCDate(); return Array.from({length:n},(_,i)=>`${ym}-${String(i+1).padStart(2,"0")}`); };
const addMonths = (ym,n) => { const [y,m] = ym.split("-").map(Number); const d = new Date(Date.UTC(y,m-1+n,1)); return d.toISOString().slice(0,7); };

const hmMin = hm => { const m = String(hm || "").match(/^(\d{1,2}):(\d{2})/); return m ? (+m[1])*60 + (+m[2]) : null; };
/* Rome wall-clock time on a date -> epoch ms */
function romeMs(date, hm){
  const [y,m,d] = date.split("-").map(Number), mm = hmMin(hm) || 0;
  const guess = Date.UTC(y, m-1, d, Math.floor(mm/60), mm%60);

/* ---------- tours (Tur Programı calendar, read by his Google script) ---------- */
function parseTour(ev){
  if (!ev || !ev.tarih || !ev.saat) return null;
  const sum = ev.baslik || "", desc = ev.aciklama || "";
  const cancelled = /^\s*(IPTAL|İPTAL|iptal)/.test(sum) || /\bCANCEL\b/.test(sum);
  const external = /^\s*(DIŞ|DİŞ|Dış|DIS)/.test(sum);
  let pax = 0; const mp = sum.match(/\((\d+)\)/) || desc.match(/Ki[sş]i:\s*(\d+)/i); if (mp) pax = +mp[1];
  let net = 0; const mn = desc.match(/Net:\s*EUR\s*([\d.,]+)/i); if (mn) net = parseFloat(mn[1].replace(/\./g,"").replace(",", ".")) || 0;
  const platform = /\bGYG\b/.test(sum) ? "GYG" : /\bVIA\b/.test(sum) ? "VIA" : "";
  const name = sum.replace(/^\s*(IPTAL|İPTAL)\s*-\s*/i,"").replace(/^\s*\d{1,2}:\d{2}(\?\s*\([^)]*\))?\s*/,"").replace(/\(\d+\)/,"").replace(/\b(GYG|VIA)\b/,"").replace(/\s+/g," ").trim();
  const guide = ((desc.match(/Guide:\s*([^\n]+)/) || [])[1] || "").trim();
  const closed = /Kapan[ıi][sş]:\s*yap[ıi]ld[ıi]/i.test(desc);
  return {date: ev.tarih, time: ev.saat, name, pax, net, platform, guide, closed, cancelled, external};
}
function storeTours(key, list){
  S.tours.cache[key] = {events: (list || []).map(parseTour).filter(Boolean), storedAt: Date.now()};
  if (key === S.tours.key) { S.tours.err = null; S.tours.status = "ok"; }
}
function toursFor(date){
  const c = S.tours.cache[weekStart(date)];
  return c ? toursFromEvents(c.events, date) : null;
}
function toursFromEvents(events, date){
  const all = events.filter(t => t.date === date).sort((a,b) => a.time < b.time ? -1 : a.time > b.time ? 1 : 0);
  const real = all.filter(t => !t.cancelled && !t.external);
  const nowMin = date === S.today ? hmMin(nowHM()) : (date < S.today ? 9999 : -1);
  return {list: real, count: real.length, pax: real.reduce((a,t)=>a+t.pax,0), net: real.reduce((a,t)=>a+t.net,0),
          closed: real.filter(t=>t.closed).length, external: all.filter(t=>t.external && !t.cancelled).length,
          cancelled: all.filter(t=>t.cancelled).length,
          rehbersiz: real.filter(t => !t.guide).length,
          acik: real.filter(t => !t.closed && (hmMin(t.time) ?? 0) + 90 <= nowMin).length,
          ilk: real.length ? real[0].time : null, son: real.length ? real[real.length-1].time : null};
}

function paraGozlem(ym, p, a, cur){
  const out = [];
  const katList = KAT_GIDER.map(k => ({k, v: p.kat[k.k] || 0})).filter(x => x.v > 0).sort((x,y) => y.v - x.v);
  if (katList.length) out.push(["", `En çok <b>${esc(katList[0].k.l)}</b>: ${eur(katList[0].v)} (giderin %${Math.round(katList[0].v/p.gider*100)}'i).`]);
  if (cur) {
    const gecen = Math.max(1, +S.today.slice(8,10)), n = monthDays(ym).length;
    if (p.gider > 0 && gecen >= 3) out.push(["", `Günde ortalama ${eur(p.gider/gecen)}. Bu hızla ay sonu gideri ≈ <b>${eur(p.gider/gecen*n)}</b>.`]);
  }
  const sg = sigaraAy(ym);
  if (sg > 0) {
    const c = sg / 20 * (a.paket || 6.5), ay = cur ? c * monthDays(ym).length / Math.max(1, +S.today.slice(8,10)) : c;
    out.push(["warn", `Sigara (sayaçtan): bu ay ${sg} adet ≈ <b>${eur(c)}</b>.${cur ? ` Bu hızla ay sonunda ≈ ${eur(ay)}; yarıya insen ayda ≈ ${eur(ay/2)} cebinde kalır.` : ""}`]);
  }
  if (!p.kalemler.length) out.push(["", "Bir hafta boyunca her harcamayı gir (kahve dahil). Neye para gittiğini ilk hafta sonunda net göreceksin."]);
  if (p.gelir === 0 && p.gider > 0) out.push(["", "Gelir girmedin. Hak ediş, bahşiş ya da ödeme geldiğinde “Gelir” olarak ekle; net kalan doğru hesaplansın."]);
  return out.map(([c, t]) => `<div class="insight ${c}">${c === "warn" ? I.alert : I.trend}<span>${t}</span></div>`).join("");
}

function kendiniTani(){
  const days = []; for (let i = 0; i < 30; i++) { const x = addDays(S.today, -i), d = S.days[x]; if (d) days.push(d); }
  const withMood = days.filter(d => d.mood != null);
  const avg = a => a.length ? a.reduce((x,y) => x+y, 0) / a.length : null;
  const out = [];
  if (withMood.length >= 5) {
    const sp = withMood.filter(d => (d.checks || {}).spor).map(d => d.mood), ns = withMood.filter(d => !(d.checks || {}).spor).map(d => d.mood);
    if (sp.length >= 2 && ns.length >= 2) out.push(`Spor yaptığın günlerde ruh halin ortalama <b>${nf1.format(avg(sp))}</b>, yapmadığın günlerde <b>${nf1.format(avg(ns))}</b>.`);
    const sl = withMood.filter(d => d.sleep != null);
    const iyi = sl.filter(d => d.sleep >= 7).map(d => d.energy ?? d.mood), kot = sl.filter(d => d.sleep < 7).map(d => d.energy ?? d.mood);
    if (iyi.length >= 2 && kot.length >= 2) out.push(`7 saat ve üstü uyuduğun günler enerjin <b>${nf1.format(avg(iyi))}</b>; daha az uyuduğun günler <b>${nf1.format(avg(kot))}</b>.`);
    const sg = withMood.filter(d => (d.counts || {}).sigara != null);
    if (sg.length >= 4) { const med = sg.map(d => d.counts.sigara).sort((a,b) => a-b)[Math.floor(sg.length/2)];
      const az = sg.filter(d => d.counts.sigara <= med).map(d => d.mood), cok = sg.filter(d => d.counts.sigara > med).map(d => d.mood);
      if (az.length >= 2 && cok.length >= 2) out.push(`Sigarayı ${med} ve altında tuttuğun günler ruh halin <b>${nf1.format(avg(az))}</b>, daha fazla içtiğin günler <b>${nf1.format(avg(cok))}</b>.`); }
    const pl = withMood.filter(d => (d.plan || []).length);
    const tam = pl.filter(d => dayPct(d) >= .8).map(d => d.mood), eks = pl.filter(d => dayPct(d) < .8).map(d => d.mood);
    if (tam.length >= 2 && eks.length >= 2) out.push(`Planının %80'ini bitirdiğin günler ruh halin <b>${nf1.format(avg(tam))}</b>, bitiremediğin günler <b>${nf1.format(avg(eks))}</b>.`);
  }
  if (out.length) return out.map(t => `<div class="insight">${I.trend}<span>${t}</span></div>`).join("");
  return `<p class="empty" style="margin-bottom:8px">${withMood.length} gün kayıt var. 5 günden sonra burada kendi kalıpların çıkmaya başlar. Bunun için en çok işe yarayanlar:</p>
    <div class="insight">${I.check}<span><b>Ruh hali, enerji, odak</b> (her akşam): her şeyin karşılaştırıldığı temel çizgi.</span></div>
    <div class="insight">${I.check}<span><b>Yatış ve kalkış saati</b>: uyku süresi ve düzeni, ertesi günün enerjisini en çok belirleyen şey.</span></div>
    <div class="insight">${I.check}<span><b>Sigara, kahve, alkol</b>: hangisinin uykuyu ve ruh halini bozduğunu gösterir.</span></div>
    <div class="insight">${I.check}<span><b>Spor ve hareket</b>: enerjiyle bağını birkaç haftada görürsün.</span></div>
    <div class="insight">${I.check}<span><b>Harcamalar</b>: ruh halinin düşük olduğu günler daha çok mu harcıyorsun?</span></div>
    <div class="insight">${I.check}<span><b>Bir cümle not</b>: rakamların neden öyle olduğunu üç ay sonra sadece bu hatırlatır.</span></div>`;
}

let undoRec = null;
function curVal(path){

  return t ? t[id] : undefined;
}
function touch(path){ if (undoRec && !(path in undoRec)) { const v = curVal(path); undoRec[path] = v ? clone(v) : null; } }
const SYN = {"çiş":"cis","cis":"cis","küçük tuvalet":"cis","idrar":"cis","kaka":"buyuk","büyük":"buyuk","büyük tuvalet":"buyuk","buyuk":"buyuk","sigara":"sigara","su":"su","spor":"spor","gym":"spor","antrenman":"spor","okuma":"okuma","kitap":"okuma"};
function habitKey(k){
  const l = trLow(k); if (SYN[l]) return SYN[l];
  const h = habits().find(x => x.key === l || trLow(x.label) === l); if (h) return h.key;
  return l.replace(/[^a-z0-9çğıöşü]+/g, "_").replace(/^_|_$/g, "").slice(0, 24) || "diger";
}
const habitLabel = k => (habits().find(h => h.key === k) || {label: k}).label;
function logDay(i){
  const date = S.today, done = [];
  touch("days/" + date);
  const d = S.days[date] || (S.days[date] = blankDay(date));
  d.counts = d.counts || {}; d.checks = d.checks || {};
  for (const [k0, v] of Object.entries(i.sayac_ekle || {})) { const n = Math.round(Number(v)); if (!isFinite(n)) continue; const k = habitKey(k0); d.counts[k] = Math.max(0, (d.counts[k] || 0) + n); done.push(`${habitLabel(k)} +${n} (bugün ${d.counts[k]})`); }
  for (const [k0, v] of Object.entries(i.isaretle || {})) { const k = habitKey(k0); d.checks[k] = !!v; done.push(`${habitLabel(k)} ✓`); }
  if (i.uyku != null) { d.sleep = Math.max(0, Math.min(16, Math.round(Number(i.uyku) * 2) / 2)); done.push(`uyku ${nf1.format(d.sleep)} sa`); }
  for (const p of i.para || []) {
    d.para = (d.para || []).concat([{id: uid(), tip: p.tip, tutar: p.tutar, kat: p.kat, not: p.not, saat: nowHM()}]);
    done.push(`${p.tip === "gelir" ? "gelir +" : "gider −"}${eur2(p.tutar)} ${katBul(p.kat, p.tip).l}${p.not && p.not !== katBul(p.kat, p.tip).l ? " (" + p.not + ")" : ""}`);
  }
  saveDay(date); hatirlatKur(); scheduleRender();
  return {yapilan: done};
}

/* ---------- instant parser for simple Turkish logs; anything else goes to Claude ---------- */
const SAYI = {"bir":1,"iki":2,"üç":3,"uç":3,"dört":4,"beş":5,"altı":6,"yedi":7,"sekiz":8,"dokuz":9,"on":10,"yarım":0.5};
const NUMRE = "(\\d+(?:[.,]\\d+)?|bir|iki|üç|dört|beş|altı|yedi|sekiz|dokuz|on|yarım)";
const escRe = s => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
const sayiOku = s => s == null ? null : (SAYI[s] != null ? SAYI[s] : Number(String(s).replace(",", ".")));
const PARA_PARA = /(€|\beuro?\b|\beur\b|\bavro\b|\bharcadım\b|\bharcama\b|\bödedim\b|\bverdim\b|\bkazandım\b|\bbahşiş\b|\bmaaş\b|\bgelir\b|\bgider\b)/;
const GELIR_RE = /(\bkazandım\b|\bkazanç\b|\bgelir\b|\bbahşiş\b|\bmaaş\b|\bhak ?ediş\b|\btahsil\b|\bödeme aldım\b|\bpara aldım\b|\byattı\b|\bgeldi\b)/;
/* "12 euro öğle yemeği", "benzine 20€", "+50 bahşiş", "kira 600 ödedim" */
function paraOku(p){
  const m = p.match(/€\s*(\d+(?:[.,]\d{1,2})?)/) || p.match(/(\d+(?:[.,]\d{1,2})?)\s*(?:€|euro?|eur|avro)?/);
  if (!m) return null;
  const tutar = Number(m[1].replace(",", "."));
  if (!(tutar > 0 && tutar <= 50000)) return null;
  const tip = /^\+/.test(p) || GELIR_RE.test(p) ? "gelir" : "gider";
  const list = tip === "gelir" ? KAT_GELIR : KAT_GIDER;
  let kat = null;
  for (const k of list) if (k.w.some(w => new RegExp("(^|\\s)" + escRe(w) + "(\\s|$|[.,!])").test(p))) { kat = k.k; break; }
  if (!kat) kat = tip === "gelir" ? "diger_gelir" : "diger";
  let not = p.replace(m[0], " ").replace(/^\+/, "").replace(/(€|\beuro?\b|\beur\b|\bavro\b|\bharcadım\b|\bharcama\b|\bödedim\b|\bverdim\b|\bkazandım\b|\bgelir\b|\bgider\b|\baldım\b|\bpara\b|\biçin\b)/g, " ").replace(/\s+/g, " ").trim();
  if (not) not = not.charAt(0).toLocaleUpperCase("tr") + not.slice(1);
  return {tip, tutar: Math.round(tutar*100)/100, kat, not: not.slice(0, 60) || katBul(kat, tip).l};
}
function localParse(text){
  const t = trLow(text).replace(/[!]+/g, " ").replace(/\s+/g, " ").trim().replace(/\.$/, "");
  if (!t) return null;
  if (/(\?|\bdün\b|yarın|geçen|haftaya|pazartesi|salı|çarşamba|perşembe|\bcuma\b|cumartesi|\bpazar\b|\d{1,2}:\d{2}|\bsaat \d|randevu|toplantı|hedef|plan|\bkaç\b|nasıl|ne zaman|neden|hatırlat|ekle|yaz\b)/.test(t)) return null;
  const parts = t.split(/\s*(?:,|;|\bve\b|\bsonra\b|\bayrıca\b|\bbir de\b)\s*/).filter(Boolean);
  const op = {sayac_ekle: {}, isaretle: {}, para: []}; let any = false, m;
  const add = (k, n) => { op.sayac_ekle[k] = (op.sayac_ekle[k] || 0) + n; any = true; };
  const re = s => new RegExp("^" + s + "$");
  for (const p of parts) {
    if (/(m[ae]d[ıi]m|m[ae]d[ıi]k|\byok\b|değil|olmadı|azalt|\bsil\b|yanlış|iptal|geri al)/.test(p)) return null;
    if (PARA_PARA.test(p) || /^\+\s*\d/.test(p)) { const e = paraOku(p); if (!e) return null; op.para.push(e); any = true; continue; }
    if ((m = p.match(re("(?:" + NUMRE + "\\s*(?:tane|adet|dal)?\\s*)?sigara(?:\\s+(?:içtim|yaktım))?")))) { add("sigara", m[1] ? sayiOku(m[1]) : 1); continue; }
    if ((m = p.match(re("(?:" + NUMRE + "\\s*(?:bardak|tane)?\\s*)?su(?:\\s+içtim)?")))) { add("su", m[1] ? sayiOku(m[1]) : 1); continue; }
    if ((m = p.match(re("(?:" + NUMRE + "\\s*(?:kez|kere|defa)\\s*)?(?:çiş(?:e gittim|imi yaptım| yaptım)?|küçük tuvalet(?:e gittim)?)")))) { add("cis", m[1] ? sayiOku(m[1]) : 1); continue; }
    if ((m = p.match(re("(?:" + NUMRE + "\\s*(?:kez|kere|defa)\\s*)?(?:kaka(?: yaptım)?|büyük tuvalet(?:e gittim)?|büyük abdest(?:imi yaptım)?)")))) { add("buyuk", m[1] ? sayiOku(m[1]) : 1); continue; }
    if (/^(spor(?: yaptım)?|gym(?:e gittim)?|salona gittim|antrenman(?: yaptım)?|koştum|koşu(?: yaptım)?|yüzdüm|fitness(?: yaptım)?|workout(?: yaptım)?)$/.test(p)) { op.isaretle.spor = true; any = true; continue; }
    if (/^(kitap okudum|kitap|okudum|okuma(?: yaptım)?)$/.test(p)) { op.isaretle.okuma = true; any = true; continue; }
    if ((m = p.match(re(NUMRE + "\\s*saat\\s*(?:uyudum|uyku)"))) || (m = p.match(re("uyku\\s*" + NUMRE + "(?:\\s*saat)?")))) { op.uyku = sayiOku(m[1]); any = true; continue; }
    const cnt = habits().filter(h => h.type === "count" && !["sigara","su","cis","buyuk"].includes(h.key));
    const hit = cnt.find(h => (m = p.match(re("(?:" + NUMRE + "\\s*(?:tane|bardak|fincan|kez|kere|saat)?\\s*)?" + escRe(trLow(h.label).replace(/\s*\(.*\)$/, "")) + "(?:\\s+\\S+)?"))));
    if (hit) { add(hit.key, m[1] ? sayiOku(m[1]) : 1); continue; }
    const hitC = habits().find(h => h.type === "check" && p === trLow(h.label));
    if (hitC) { op.isaretle[hitC.key] = true; any = true; continue; }
    return null;
  }
  if (!any) return null;
  for (const k in op.sayac_ekle) { const n = Math.round(op.sayac_ekle[k]); if (!isFinite(n) || n <= 0 || n > 60) return null; op.sayac_ekle[k] = n; }
  if (op.uyku != null && !(op.uyku > 0 && op.uyku <= 16)) return null;
  return op;
}

/* ---------- composer / agent ---------- */
function growInput(){ const el = document.getElementById("abInput"); if (!el) return; el.style.height = "auto"; el.style.height = Math.min(150, el.scrollHeight) + "px"; }
function openComposer(){ S.agent.open = true; if (!S.agent.pending && !S.agent.undo) { S.agent.you = ""; S.agent.reply = ""; S.agent.error = null; } renderSheet(); setTimeout(() => { const el = document.getElementById("abInput"); if (el && !IOS) el.focus(); }, 60); }
function runAgent(text){
  text = String(text || "").trim(); const a = S.agent;
  if (!text) return;
  const inp = document.getElementById("abInput"); if (inp) inp.value = "";
  a.open = true; a.you = text; a.reply = ""; a.error = null; a.undo = null; a.pending = false;
  const id = "g" + uid(), zaman = new Date().toISOString();
  a.gelenId = id;
  const op = localParse(text);
  if (op) {
    undoRec = {};
    let r; try { r = logDay(op); } finally { a.undo = undoRec && Object.keys(undoRec).length ? undoRec : null; undoRec = null; }
    const ozet = "Kaydettim: " + r.yapilan.join(", ") + ".";
    a.reply = ozet;
    const k = {id, metin: text, durum: "uygulama", sonuc: ozet, zaman, gonderildi: false};
    S.gelen.push(k); if (S.mode !== "mock") gelenGonder(k);
  } else {
    a.pending = true;
    a.reply = "Claude'a ilettim. En geç 1 saat içinde işler; cevabı Bildirimler'de görürsün.";
    const k = {id, metin: text, durum: "bekliyor", sonuc: "", zaman, gonderildi: false};
    S.gelen.push(k); if (S.mode !== "mock") gelenGonder(k);
  }
  cacheSave(); render(); renderSheet();
}
function undoAgent(){
  const a = S.agent, u = a.undo; if (!u) return;
  for (const [path, prev] of Object.entries(u)) {
    if (path === "meta/settings") { S.settings = prev ? clone(prev) : null; queueSave(path, prev ? clone(prev) : null, 0); continue; }
    const [col, id] = path.split("/");
    const t = col === "days" ? S.days : col === "goals" ? S.goals : S.notes;
    if (prev === null) { delete t[id]; queueSave(path, null, 0); } else { t[id] = clone(prev); queueSave(path, clone(prev), 0); }
  }
  gelenIptal(a.gelenId);
  a.undo = null; a.reply += "\n\n(Geri alındı.)"; render(); renderSheet();
}
function gelenIptal(id){
  const g = S.gelen.find(x => x.id === id); if (!g) return;
  g.durum = "iptal";
  const once = LS.get(K_GELEN_KUYRUK) || [], kuyruk = once.filter(x => x.id !== id);
  LS.set(K_GELEN_KUYRUK, kuyruk);
  if (kuyruk.length === once.length && S.mode !== "mock") api("gelenIptal", {id}).catch(() => {});
  if (S.agent.gelenId === id) { S.agent.pending = false; S.agent.reply = "İptal edildi."; }
  cacheSave(); render(); renderSheet();
}

/* voice: Safari's speech recognition when available, otherwise the keyboard mic */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, recOn = false;
function micToggle(){
  if (!SR) return;
  if (recOn) { try { rec.stop(); } catch (e) {} return; }
  let final = "";
  rec = new SR(); rec.lang = "tr-TR"; rec.interimResults = true; rec.continuous = false;
  rec.onresult = e => { let t = ""; for (let i = 0; i < e.results.length; i++) t += e.results[i][0].transcript; const el = document.getElementById("abInput"); if (el) { el.value = t; growInput(); } final = t; };
  rec.onerror = e => {
    recOn = false; renderSheet();
    if (e.error === "not-allowed" || e.error === "service-not-allowed") { S.agent.error = "Mikrofon izni yok. Klavyedeki 🎤 ile söyleyebilirsin."; renderSheet(); }
  };
  rec.onend = () => { recOn = false; renderSheet(); if (final.trim()) runAgent(final); };
  try { rec.start(); recOn = true; renderSheet(); } catch (e) { recOn = false; renderSheet(); }
}

function scheduleRender(){ if (typing()) { renderPending = true; return; } render(); }
view.addEventListener("focusout", () => { if (renderPending) setTimeout(() => { if (!typing() && renderPending) { renderPending = false; render(); } }, 60); });

  renderPending = false;

/* bell on a plan item: put it in Google Calendar so the phone rings even when the app is closed */

  if (S.mode === "mock") { editDay(date, d => { const x = (d.plan || []).find(p => p.id === id); if (x) x.takvim = true; }); toast("Önizleme: gerçek uygulamada Google Takvim'e eklenir."); render(); return; }
  api("randevu", {baslik: it.title, tarih: date, saat: it.time}).then(() => {
    editDay(date, d => { const x = (d.plan || []).find(p => p.id === id); if (x) x.takvim = true; });

  }).catch(err => { S.banner = "Takvime eklenemedi: " + hataMetni(err); render(); });

document.addEventListener("pointerout", e => { if (e.pointerType === "mouse" && e.target.closest && e.target.closest("[data-tip]")) hideTip(); });
document.addEventListener("pointerup", e => { const el = e.target.closest && e.target.closest("[data-tip]"); if (el && e.pointerType !== "mouse") showTip(el, e.clientX, e.clientY); });
document.getElementById("main").addEventListener("scroll", hideTip, {passive: true});

const girisEl = document.getElementById("giris");
function girisGoster(hata){
  girisEl.hidden = false;
  document.getElementById("gHata").textContent = hata || "";
  document.getElementById("gEkle").hidden = !(IOS && !STANDALONE);
}
async function girisYap(text){
  const o = linkCoz(text);
  if (!o) { girisGoster("Bu link tanınmadı. Kurulumda çıkan linkin tamamını yapıştır."); return false; }
  OTURUM = o; LS.set(K_OTURUM, o);
  const btn = document.getElementById("gBtn"); btn.disabled = true; btn.textContent = "Bağlanıyor…";
  const ok = await load();
  btn.disabled = false; btn.textContent = "Giriş yap";
  if (ok) { girisEl.hidden = true; watchTours(); render(); return true; }
  if (OTURUM) { const msg = S.banner || "Bağlanılamadı."; OTURUM = null; LS.del(K_OTURUM); S.banner = null; S.bannerKind = null; girisGoster(msg); }
  return false;
}
function cikis(yetkiHatasi){
  OTURUM = null; [K_OTURUM, K_ONBELLEK, K_BEKLEYEN, K_GELEN_KUYRUK].forEach(k => LS.del(k)); bekleyen = {};
  S.days = {}; S.goals = {}; S.notes = {}; S.settings = null; S.gelen = []; S.tours.cache = {}; S.loaded = false; S.mode = "loading"; S.banner = null; S.bannerKind = null;
  girisGoster(yetkiHatasi ? "Giriş linki artık geçerli değil. Yeni linki yapıştır." : ""); render();
}
